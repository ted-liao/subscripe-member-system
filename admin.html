<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理後台 - 廖嘉泰の會員管理系統</title>
<style>
/* =====================================================
(1/3) STYLE (CSS)
與 index.html 完全相同的 CSS，確保風格一致
=====================================================
*/
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Microsoft JhengHei', 'PingFang TC', Arial, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    padding: 20px;
}

.container {
    max-width: 1200px;
    margin: 0 auto;
}

.top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 30px;
    flex-wrap: wrap;
    gap: 15px;
}

.header {
    color: white;
}

.header h1 {
    font-size: 2.5em;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
    margin-bottom: 5px;
}

.header p {
    font-size: 1.1em;
}

.user-section {
    display: flex;
    gap: 10px;
    align-items: center;
}

.user-info {
    background: white;
    padding: 12px 20px;
    border-radius: 25px;
    display: flex;
    align-items: center;
    gap: 10px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
}

.user-info .avatar {
    width: 35px;
    height: 35px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-weight: bold;
}

.user-info .name {
    font-weight: bold;
    color: #333;
}

.badge-admin {
    background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
    color: white;
    padding: 3px 10px;
    border-radius: 12px;
    font-size: 12px;
    font-weight: bold;
}

.card {
    background: white;
    border-radius: 15px;
    padding: 30px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    margin-bottom: 20px;
}

.tabs {
    display: flex;
    gap: 10px;
    margin-bottom: 30px;
    flex-wrap: wrap;
}

.tab {
    padding: 12px 24px;
    background: #f0f0f0;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
    transition: all 0.3s;
}

.tab.active {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
}

.tab:hover {
    transform: translateY(-2px);
}

.page {
    display: none;
}

.page.active {
    display: block;
}

.sub-tabs {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
    border-bottom: 2px solid #e0e0e0;
    padding-bottom: 10px;
}

.sub-tab {
    padding: 10px 20px;
    background: transparent;
    border: none;
    border-bottom: 3px solid transparent;
    cursor: pointer;
    font-size: 15px;
    color: #666;
    transition: all 0.3s;
}

.sub-tab.active {
    color: #667eea;
    border-bottom-color: #667eea;
    font-weight: bold;
}

.sub-tab:hover {
    color: #667eea;
}

.sub-page {
    display: none;
}

.sub-page.active {
    display: block;
}

.input-group {
    margin-bottom: 20px;
}

.input-group label {
    display: block;
    margin-bottom: 8px;
    color: #333;
    font-weight: bold;
}

.input-group label .optional {
    font-weight: normal;
    color: #999;
    font-size: 0.9em;
}

.input-group input, .input-group select, .input-group textarea {
    width: 100%;
    padding: 12px;
    border: 2px solid #e0e0e0;
    border-radius: 8px;
    font-size: 16px;
    transition: border 0.3s;
    font-family: inherit;
}

.input-group input:focus, .input-group select:focus, .input-group textarea:focus {
    outline: none;
    border-color: #667eea;
}

.input-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
    gap: 10px;
}

.input-row input {
    text-align: center;
}

.btn {
    padding: 12px 30px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
    transition: all 0.3s;
}

.btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
}

.btn-danger {
    background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
}

.btn-success {
    background: linear-gradient(135deg, #84fab0 0%, #8fd3f4 100%);
}

.btn-small {
    padding: 8px 16px;
    font-size: 14px;
}

.btn-link {
    background: none;
    color: #667eea;
    text-decoration: underline;
    padding: 5px;
    font-size: 14px;
}

.btn-link:hover {
    transform: none;
    box-shadow: none;
    color: #764ba2;
}

.btn-copy {
    background: #667eea;
    color: white;
    border: none;
    padding: 5px 12px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 14px;
    margin-left: 10px;
    transition: all 0.3s;
}

.btn-copy:hover {
    background: #764ba2;
    transform: scale(1.05);
}

.member-info {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    padding: 25px;
    border-radius: 12px;
    margin-bottom: 20px;
}

.member-info h2 {
    margin-bottom: 15px;
}

.info-item {
    display: flex;
    justify-content: space-between;
    padding: 10px 0;
    border-bottom: 1px solid rgba(255,255,255,0.2);
    align-items: center;
}

.info-item:last-child {
    border-bottom: none;
}

.badge {
    display: inline-block;
    padding: 5px 15px;
    border-radius: 20px;
    font-size: 14px;
    font-weight: bold;
}

.badge-vip {
    background: gold;
    color: #333;
}

.badge-premium {
    background: silver;
    color: #333;
}

.badge-normal {
    background: #95a5a6;
    color: white;
}

.queue-card {
    background: #f9f9f9;
    padding: 30px;
    border-radius: 10px;
    text-align: center;
    margin-bottom: 20px;
}

.queue-position {
    font-size: 3em;
    font-weight: bold;
    color: #667eea;
    margin: 20px 0;
}

.queue-status {
    background: white;
    padding: 20px;
    border-radius: 10px;
    margin-top: 20px;
}

.queue-item {
    background: #f9f9f9;
    padding: 15px;
    border-radius: 8px;
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.queue-item.current {
    background: #d4edda;
    border: 2px solid #28a745;
}

.member-item {
    background: #f9f9f9;
    padding: 20px;
    border-radius: 10px;
    margin-bottom: 15px;
    border-left: 4px solid #667eea;
}

/* 更改 .member-item.expired 的樣式 */
.member-item.expired {
    background: #f1f1f1;
    border-left-color: #999;
}
/* 更改 .member-item.active 的樣式 */
.member-item.active {
    background: #e8f5e9;
    border-left-color: #28a745;
}


.code-item {
    background: #fff3cd;
    padding: 20px;
    border-radius: 10px;
    margin-bottom: 15px;
    border-left: 4px solid #ffc107;
}

.code-item.used {
    background: #d4edda;
    border-left-color: #28a745;
}

.member-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    flex-wrap: wrap;
    gap: 10px;
}

.admin-actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

.empty-state {
    text-align: center;
    padding: 40px;
    color: #999;
}

.time-display {
    font-size: 1.5em;
    font-weight: bold;
    color: #27ae60;
    margin: 10px 0;
}

.time-display.warning {
    color: #f39c12;
}

.time-display.danger {
    color: #e74c3c;
}

.countdown-time {
    font-weight: bold;
    color: #27ae60;
}

.countdown-time.warning {
    color: #f39c12;
}

.countdown-time.danger {
    color: #e74c3c;
}

.text-link {
    text-align: center;
    margin-top: 15px;
}

.modal {
    display: none;
    position: fixed;
    z-index: 1000;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0,0,0,0.5);
}

.modal.active {
    display: flex;
    justify-content: center;
    align-items: center;
}

.modal-content {
    background-color: white;
    padding: 30px;
    border-radius: 15px;
    max-width: 500px;
    width: 90%;
    max-height: 90vh;
    overflow-y: auto;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
}

.modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

.modal-close {
    background: none;
    border: none;
    font-size: 24px;
    cursor: pointer;
    color: #999;
}

.modal-close:hover {
    color: #333;
}

.game-session-card {
    background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
    color: white;
    padding: 25px;
    border-radius: 12px;
    margin-bottom: 20px;
    text-align: center;
}

.game-session-card h2 {
    margin-bottom: 15px;
}

.game-session-info {
    font-size: 1.2em;
    margin: 10px 0;
}

.auto-refresh-indicator {
    display: inline-block;
    width: 10px;
    height: 10px;
    background: #28a745;
    border-radius: 50%;
    margin-left: 10px;
    animation: pulse 2s infinite;
}

.warning-box {
    background: #fff3cd;
    border: 2px solid #ffc107;
    color: #856404;
    padding: 15px;
    border-radius: 8px;
    margin-bottom: 20px;
}

.warning-box strong {
    display: block;
    margin-bottom: 5px;
}

.code-display {
    background: #f8f9fa;
    border: 2px dashed #667eea;
    padding: 20px;
    border-radius: 10px;
    text-align: center;
    margin: 20px 0;
}

.code-display .code {
    font-size: 2em;
    font-weight: bold;
    color: #667eea;
    letter-spacing: 3px;
    font-family: 'Courier New', monospace;
}

.copy-area {
    display: inline-flex;
    align-items: center;
    gap: 10px;
}

.admin-panel {
    display: none;
    margin-top: 30px;
    padding: 20px;
    background: #f0f8ff;
    border: 2px solid #667eea;
    border-radius: 10px;
}

.admin-panel.active {
    display: block;
}

.admin-panel h3 {
    color: #667eea;
    margin-bottom: 20px;
}

.backup-info {
    background: #e8f5e9;
    padding: 15px;
    border-radius: 8px;
    margin-bottom: 20px;
    border-left: 4px solid #4caf50;
}

.backup-info strong {
    color: #2e7d32;
}

.settings-section {
    background: #f9f9f9;
    padding: 20px;
    border-radius: 10px;
    margin-bottom: 20px;
}

.settings-section h4 {
    margin-bottom: 15px;
    color: #667eea;
}

.loading-overlay {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.7);
    z-index: 9999;
    justify-content: center;
    align-items: center;
}

.loading-overlay.active {
    display: flex;
}

.loading-spinner {
    width: 50px;
    height: 50px;
    border: 5px solid #f3f3f3;
    border-top: 5px solid #667eea;
    border-radius: 50%;
    animation: spin 1s linear infinite;
}

/* ADMIN.HTML 專用樣式 */
.admin-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
    gap: 20px;
}

.card h2 {
    color: #667eea;
    margin-bottom: 20px;
    border-bottom: 2px solid #f0f0f0;
    padding-bottom: 10px;
}

/* 列表的最大高度和滾動條 */
.list-container {
    max-height: 400px;
    overflow-y: auto;
    padding-right: 10px;
    border: 1px solid #f0f0f0;
    border-radius: 8px;
    padding: 10px;
}

@keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}

@keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
}

@media (max-width: 768px) {
    .header h1 {
        font-size: 1.8em;
    }

    .card {
        padding: 20px;
    }

    .tabs {
        flex-direction: column;
    }

    .tab {
        width: 100%;
    }

    .top-bar {
        flex-direction: column;
        align-items: flex-start;
    }

    .user-section {
        width: 100%;
        flex-direction: column;
    }

    .user-info {
        width: 100%;
        justify-content: center;
    }

    .sub-tabs {
        flex-wrap: wrap;
    }
}
</style>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>

<div id="loadingOverlay" class="loading-overlay">
    <div class="loading-spinner"></div>
</div>

<div class="container">
    <div class="top-bar">
        <div class="header">
            <h1>⚙️ 管理後台</h1>
            <p> 📢 廖嘉泰の會員管理系統</p>
        </div>

        <div class="user-section" id="userSection">
            </div>
    </div>

    <div id="adminDashboard" style="display: none;">

        <div class="admin-grid">
            <div class="card">
                <h2>🎮 遊戲場次控制</h2>
                <div id="currentGameSession">
                    </div>
                <div class="input-group">
                    <label>場次名稱 (例如: 會員場)</label>
                    <input type="text" id="sessionGameName" placeholder="CODM 會員場">
                </div>
                <div class="input-group">
                    <label>名額</label>
                    <input type="number" id="sessionSlots" value="10">
                </div>
                <div class="input-group">
                    <label>描述 <span class="optional">(選填)</span></label>
                    <input type="text" id="sessionDescription" placeholder="地圖:...">
                </div>
                <button class="btn" onclick="createGameSession()">🚀 開啟場次</button>
                <button class="btn btn-danger" onclick="closeGameSession()">❌ 關閉場次</button>
            </div>

            <div class="card">
                <h2>👥 目前排隊名單</h2>
                <div style="margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center;">
                    <span id="queueCount"></span>
                    <button class="btn btn-danger btn-small" onclick="clearQueue()">清空名單</button>
                </div>
                <div class="list-container" id="adminQueueList">
                    </div>
            </div>
        </div>

        <div class="card">
            <h2>🔑 兌換碼管理</h2>
            <div class="sub-tabs">
                <button class="sub-tab active" onclick="showCodeSubTab('generate')">產生新碼</button>
                <button class="sub-tab" onclick="showCodeSubTab('unused')">未使用 (<span id="unusedCodeCount">0</span>)</button>
                <button class="sub-tab" onclick="showCodeSubTab('used')">已使用 (<span id="usedCodeCount">0</span>)</button>
            </div>

            <div id="generate" class="sub-page active">
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px;">
                    <div class="input-group">
                        <label>會員等級</label>
                        <select id="codeLevel">
                            <option value="normal">普通 (60元)</option>
                            <option value="premium">高級 (110元)</option>
                            <option value="vip">VIP (160元)</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>天數</label>
                        <input type="number" id="codeDays" value="30">
                    </div>
                    <div class="input-group">
                        <label>數量</label>
                        <input type="number" id="codeAmount" value="1">
                    </div>
                </div>
                <button class="btn" onclick="generateCode()">產生兌換碼</button>
                <div id="generatedCodesList" style="margin-top: 20px;"></div>
            </div>

            <div id="unused" class="sub-page">
                <div class="list-container" id="unusedCodeList"></div>
            </div>

            <div id="used" class="sub-page">
                <div class="list-container" id="usedCodeList"></div>
            </div>
        </div>

        <div class="card">
            <h2>🧑‍🤝‍🧑 會員管理</h2>
            <div class="sub-tabs">
                <button class="sub-tab active" onclick="showMemberSubTab('active')">生效中 (<span id="activeMemberCount">0</span>)</button>
                <button class="sub-tab" onclick="showMemberSubTab('expired')">已到期 (<span id="expiredMemberCount">0</span>)</button>
            </div>

            <div id="activeMembers" class="sub-page active">
                <div class="list-container" id="activeMemberList"></div>
            </div>
            <div id="expiredMembers" class="sub-page">
                <div class="list-container" id="expiredMemberList"></div>
            </div>
        </div>
        
        <div class="card">
            <h2>📈 系統備份</h2>
            <div class="backup-info" id="backupInfo">
                </div>
            <button class="btn btn-success" onclick="exportToExcel()">🗂️ 立即導出 Excel 備份</button>
        </div>

    </div>
</div>

<div id="loginModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2 id="loginModalTitle">會員登入</h2>
            <button class="modal-close" onclick="closeLoginModal()">×</button>
        </div>
        <div class="input-group">
            <label>使用者名稱</label>
            <input type="text" id="loginUsername" placeholder="請輸入使用者名稱">
        </div>
        <div class="input-group">
            <label>密碼</label>
            <input type="password" id="loginPassword" placeholder="請輸入密碼">
        </div>
        <button class="btn" onclick="login()" style="width: 100%; margin-bottom: 10px;">登入</button>
    </div>
</div>

<div id="registerModal" class="modal">
    </div>

<div id="forgotPasswordModal" class="modal">
    </div>

<div id="changePasswordModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2>更改密碼</h2>
            <button class="modal-close" onclick="closeChangePasswordModal()">×</button>
        </div>
        <div class="input-group">
            <label>目前密碼</label>
            <input type="password" id="currentPassword" placeholder="請輸入目前密碼">
        </div>
        <div class="input-group">
            <label>新密碼</label>
            <input type="password" id="changeNewPassword" placeholder="請輸入新密碼（至少6個字元）">
        </div>
        <div class="input-group">
            <label>確認新密碼</label>
            <input type="password" id="changeConfirmPassword" placeholder="請再次輸入新密碼">
        </div>
        <button class="btn" onclick="changePassword()" style="width: 100%;">確認更改</button>
    </div>
</div>

<div id="editMemberModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2>編輯會員</h2>
            <button class="modal-close" onclick="closeEditMemberModal()">×</button>
        </div>
        <div id="editMemberContent"></div>
    </div>
</div>


<script>
// =====================================================
// (3/3) JAVASCRIPT
// 包含所有 admin.html 需要的 Firebase 連接、輔助工具、和管理員功能
// =====================================================

// ==================== Firebase 初始化 ====================
const firebaseConfig = {
    apiKey: "AIzaSyCQEXz8OIzbb9dDxnz52tymNnYofGDEczQ",
    authDomain: "subscription-member-system.firebaseapp.com",
    databaseURL: "https://subscription-member-system-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "subscription-member-system",
    storageBucket: "subscription-member-system.firebasestorage.app",
    messagingSenderId: "970681171187",
    appId: "1:970681171187:web:f3f86b743e27667a994b86"
};

firebase.initializeApp(firebaseConfig);
const database = firebase.database();

// ==================== 匿名登入 (確保資料庫連線) ====================
let isAuthReady = false;

firebase.auth().onAuthStateChanged((user) => {
    if (user) {
        console.log('✅ Firebase 匿名登入成功:', user.uid);
        isAuthReady = true;

        if (!window.appInitialized) {
            window.appInitialized = true;
            // ⭐️ 啟動管理員初始化程序
            initializeAdminPage();
        }
    } else {
        console.log('⏳ 嘗試匿名登入...');
        firebase.auth().signInAnonymously()
        .catch((error) => {
            console.error('❌ 登入失敗:', error);
            alert('系統初始化失敗，請重新整理頁面');
        });
    }
});

// ==================== 全局變數 ====================
let currentUser = null;
let editingMember = null;
let countdownInterval = null;
let dailyBackupInterval = null;
let autoRefreshInterval = null;
const REFRESH_INTERVAL = 5000; // 管理員頁面 5 秒刷新一次

let currentCodeSubTab = 'generate';
let currentMemberSubTab = 'active';

// ==================== 輔助工具 (來自 index.html) ====================

function showLoading() {
    document.getElementById('loadingOverlay').classList.add('active');
}

function hideLoading() {
    document.getElementById('loadingOverlay').classList.remove('active');
}

async function hashPassword(password) {
    const encoder = new TextEncoder();
    const data = encoder.encode(password);
    const hashBuffer = await crypto.subtle.digest('SHA-256', data);
    const hashArray = Array.from(new Uint8Array(hashBuffer));
    return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
}

async function loadData() {
    try {
        const membersSnapshot = await database.ref('members').once('value');
        const codesSnapshot = await database.ref('activationCodes').once('value');
        const queueSnapshot = await database.ref('queue').once('value');
        const sessionSnapshot = await database.ref('gameSession').once('value');
        const backupSnapshot = await database.ref('lastBackupTime').once('value');

        const membersData = membersSnapshot.val() || {};
        const members = Object.keys(membersData).map(key => ({
            ...membersData[key],
            username: key
        }));

        const codesData = codesSnapshot.val() || {};
        const activationCodes = Object.values(codesData);

        const queueData = queueSnapshot.val() || {};
        const queue = Object.values(queueData).sort((a, b) => new Date(a.joinTime) - new Date(b.joinTime));

        return {
            members,
            activationCodes,
            queue,
            gameSession: sessionSnapshot.val(),
            lastBackupTime: backupSnapshot.val()
        };
    } catch (error) {
        console.error('載入資料失敗:', error);
        return { members: [], activationCodes: [], queue: [], gameSession: null, lastBackupTime: null };
    }
}

async function saveData(members, activationCodes, queue, gameSession) {
    try {
        const membersObj = {};
        members.forEach(m => { membersObj[m.username] = m; });

        const codesObj = {};
        activationCodes.forEach(c => { codesObj[c.code] = c; });

        const queueObj = {};
        queue.forEach(q => { queueObj[q.username] = q; });

        await database.ref('members').set(membersObj);
        await database.ref('activationCodes').set(codesObj);
        await database.ref('queue').set(queueObj);
        await database.ref('gameSession').set(gameSession);
    } catch (error) {
        console.error('儲存資料失敗:', error);
        alert('資料儲存失敗，請稍後再試');
    }
}

function secondsToTime(seconds) {
    if (seconds <= 0) return { years: 0, months: 0, days: 0, hours: 0, minutes: 0, seconds: 0 };
    const years = Math.floor(seconds / (365 * 24 * 60 * 60));
    seconds %= (365 * 24 * 60 * 60);
    const months = Math.floor(seconds / (30 * 24 * 60 * 60));
    seconds %= (30 * 24 * 60 * 60);
    const days = Math.floor(seconds / (24 * 60 * 60));
    seconds %= (24 * 60 * 60);
    const hours = Math.floor(seconds / (60 * 60));
    seconds %= (60 * 60);
    const minutes = Math.floor(seconds / 60);
    seconds %= 60;
    return { years, months, days, hours, minutes, seconds };
}

function timeToSeconds(years, months, days, hours, minutes, seconds) {
    return (years * 365 * 24 * 60 * 60) +
        (months * 30 * 24 * 60 * 60) +
        (days * 24 * 60 * 60) +
        (hours * 60 * 60) +
        (minutes * 60) +
        seconds;
}

function formatTimeDisplay(timeObj) {
    const parts = [];
    if (timeObj.years > 0) parts.push(`${timeObj.years}年`);
    if (timeObj.months > 0) parts.push(`${timeObj.months}月`);
    if (timeObj.days > 0) parts.push(`${timeObj.days}天`);
    if (timeObj.hours > 0) parts.push(`${timeObj.hours}時`);
    if (timeObj.minutes > 0) parts.push(`${timeObj.minutes}分`);
    if (timeObj.seconds > 0) parts.push(`${timeObj.seconds}秒`);
    return parts.join(' ') || '0秒';
}

function getTimeColorClass(seconds) {
    if (seconds <= 0) return 'danger';
    if (seconds <= 259200) return 'danger'; // 3天
    if (seconds <= 604800) return 'warning'; // 7天
    return '';
}

function generateActivationCode() {
    const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
    let code = '';
    for (let i = 0; i < 6; i++) {
        code += chars.charAt(Math.floor(Math.random() * chars.length));
    }
    return code;
}

function copyToClipboard(text, button) {
    navigator.clipboard.writeText(text).then(() => {
        const originalText = button.innerHTML;
        button.innerHTML = '✓ 已複製';
        button.style.background = '#28a745';
        setTimeout(() => {
            button.innerHTML = originalText;
            button.style.background = '#667eea';
        }, 2000);
    }).catch(() => {
        alert('複製失敗，請手動複製');
    });
}

// ==================== 登入/登出 (管理員專用) ====================
async function login() {
    const username = document.getElementById('loginUsername').value.trim();
    const password = document.getElementById('loginPassword').value.trim();

    if (!username || !password) {
        alert('請輸入使用者名稱和密碼');
        return;
    }

    showLoading();
    try {
        const data = await loadData();
        const passwordHash = await hashPassword(password);
        const member = data.members.find(m => m.username === username && m.passwordHash === passwordHash);

        if (!member) {
            alert('使用者名稱或密碼錯誤');
            hideLoading();
            return;
        }

        // ⭐️ 核心檢查：是否為管理員
        if (!member.isAdmin) {
            alert('權限不足。此頁面僅限管理員登入。');
            hideLoading();
            return;
        }

        // 登入成功，儲存狀態並初始化儀表板
        currentUser = member;
        sessionStorage.setItem('adminUser', member.username);

        alert('管理員登入成功！');
        closeLoginModal();
        await initializeAdminDashboard(); // 載入儀表板
        updateUserSection();
        
    } catch (error) {
        console.error('登入失敗:', error);
        alert('登入失敗，請稍後再試');
    } finally {
        hideLoading();
    }
}

async function logout() {
    sessionStorage.removeItem('adminUser');
    currentUser = null;
    
    // 隱藏儀表板並顯示登入畫面
    document.getElementById('adminDashboard').style.display = 'none';
    updateUserSection(); // 更新頂部為登入按鈕
    openLoginModal();
    
    stopAutoRefresh();
    stopCountdown();
    alert('已登出');
}

function updateUserSection() {
    const userSection = document.getElementById('userSection');

    if (currentUser && currentUser.isAdmin) {
        userSection.innerHTML = `
        <div class="user-info">
            <div class="avatar">${currentUser.nickname.charAt(0)}</div>
            <span class="name">${currentUser.nickname}</span>
            <span class="badge-admin">管理員</span>
        </div>
        <a href="index.html" class="btn btn-small">🏠 返回前台</a>
        <button class="btn btn-danger btn-small" onclick="logout()">登出</button>
        `;
    } else {
        userSection.innerHTML = `
        <button class="btn btn-small" onclick="openLoginModal()">登入</button>
        `;
    }
}

// ==================== 倒數計時器 ====================
// (管理員頁面也需要全域倒數，以確保資料庫中秒數準確)
function startGlobalCountdown() {
    if (countdownInterval) clearInterval(countdownInterval);

    countdownInterval = setInterval(async () => {
        await updateAllCountdowns();
    }, 1000);
}

async function updateAllCountdowns() {
    try {
        // 這段邏輯與 index.html 相同，確保後台持續更新秒數
        const data = await loadData();
        const now = Math.floor(Date.now() / 1000);
        let needSave = false;
        let needRefreshAdmin = false;

        data.members.forEach(member => {
            const elapsed = now - member.lastUpdateTime;
            if (elapsed > 0) {
                const oldExpired = member.remainingSeconds <= 0;
                member.remainingSeconds = Math.max(0, member.remainingSeconds - elapsed);
                member.lastUpdateTime = now;
                needSave = true;

                // 檢查是否有會員剛過期
                const newExpired = member.remainingSeconds <= 0;
                if (!oldExpired && newExpired) {
                    needRefreshAdmin = true;
                }
            }
        });

        if (needSave) {
            await saveData(data.members, data.activationCodes, data.queue, data.gameSession);
        }
        
        // 如果有會員剛過期，且管理員在會員分頁，則刷新
        if (needRefreshAdmin && (currentMemberSubTab === 'active' || currentMemberSubTab === 'expired')) {
             await refreshAdminDashboard();
        }

        // 更新編輯彈窗中的倒數（如果開啟）
        const modalCountdown = document.getElementById('editMemberCountdown');
        if (modalCountdown && editingMember) {
            const member = data.members.find(m => m.username === editingMember.username);
            if (member) {
                const timeObj = secondsToTime(member.remainingSeconds);
                modalCountdown.textContent = formatTimeDisplay(timeObj);
                modalCountdown.className = 'countdown-time ' + getTimeColorClass(member.remainingSeconds);
            }
        }

    } catch (error) {
        console.error('更新倒數失敗:', error);
    }
}

function stopCountdown() {
    if (countdownInterval) {
        clearInterval(countdownInterval);
        countdownInterval = null;
    }
}

// ==================== 自動刷新 (管理員專用) ====================
function startAutoRefresh() {
    if (autoRefreshInterval) clearInterval(autoRefreshInterval);

    autoRefreshInterval = setInterval(async () => {
        // 如果有彈窗開啟，則不刷新，避免干擾操作
        const hasOpenModal = document.querySelector('.modal.active');
        const isLoading = document.getElementById('loadingOverlay').classList.contains('active');
        if (hasOpenModal || isLoading) {
            return;
        }

        console.log('🔄 自動刷新管理員儀表板...');
        await refreshAdminDashboard();
    }, REFRESH_INTERVAL);
}

function stopAutoRefresh() {
    if (autoRefreshInterval) {
        clearInterval(autoRefreshInterval);
        autoRefreshInterval = null;
    }
}

// ==================== 系統初始化 (管理員專用) ====================
async function initializeAdminPage() {
    showLoading();
    try {
        // 檢查 sessionStorage 中是否有管理員登入紀錄
        const adminUsername = sessionStorage.getItem('adminUser');

        if (!adminUsername) {
            // 沒有登入紀錄，顯示登入彈窗
            console.log('未登入，要求管理員登入');
            updateUserSection(); // 顯示登入按鈕
            openLoginModal();
            hideLoading();
            return;
        }

        // 有登入紀錄，驗證此人是否仍是管理員
        const data = await loadData();
        const member = data.members.find(m => m.username === adminUsername);

        if (!member || !member.isAdmin) {
            // 紀錄的使用者已不存在或被移除管理員權限
            console.log('Session 驗證失敗，要求重新登入');
            sessionStorage.removeItem('adminUser');
            updateUserSection();
            openLoginModal();
            hideLoading();
            return;
        }

        // 驗證成功
        console.log(`管理員 ${adminUsername} 驗證成功`);
        currentUser = member;
        
        await initializeAdminDashboard();
        updateUserSection();

    } catch (error) {
        console.error('管理頁面初始化失敗:', error);
        alert('頁面載入失敗，請重試');
    } finally {
        hideLoading();
    }
}

async function initializeAdminDashboard() {
    // 顯示儀表板
    document.getElementById('adminDashboard').style.display = 'block';
    
    // 載入所有資料並渲染
    await refreshAdminDashboard();
    
    // 啟動背景任務
    startGlobalCountdown();
    startAutoRefresh();
    initDailyBackup();
}

// ==================== 儀表板刷新 (核心功能) ====================
async function refreshAdminDashboard() {
    try {
        const data = await loadData();
        
        // 1. 刷新遊戲場次
        renderGameSession(data.gameSession);
        
        // 2. 刷新排隊名單
        renderQueueList(data.queue);
        
        // 3. 刷新兌換碼 (根據當前分頁)
        renderCodeLists(data.activationCodes);
        
        // 4. 刷新會員列表 (根據當前分頁)
        renderMemberLists(data.members);
        
        // 5. 刷新備份資訊
        renderBackupInfo(data.lastBackupTime);

    } catch (error) {
        console.error("儀表板刷新失敗:", error);
    }
}

function renderGameSession(gameSession) {
    const container = document.getElementById('currentGameSession');
    if (gameSession) {
        container.innerHTML = `
        <div class="game-session-card">
            <h2>🎮 ${gameSession.gameName} (開放中)</h2>
            <div class="game-session-info">名額: ${gameSession.slots}位</div>
            <div class="game-session-info">開放時間: ${new Date(gameSession.startTime).toLocaleString('zh-TW')}</div>
            ${gameSession.description ? `<div style="margin-top: 10px; font-size: 0.9em;">${gameSession.description}</div>` : ''}
        </div>
        `;
    } else {
        container.innerHTML = `
        <div class="empty-state" style="background: #f9f9f9; border-radius: 8px; padding: 20px;">
            <h3>目前沒有遊戲場次</h3>
            <p>請填寫下方表單以開啟新場次</p>
        </div>
        `;
    }
}

function renderQueueList(queue) {
    const container = document.getElementById('adminQueueList');
    document.getElementById('queueCount').textContent = `總數: ${queue.length} 人`;
    
    if (queue.length === 0) {
        container.innerHTML = '<div class="empty-state">目前沒有人排隊</div>';
        return;
    }
    
    container.innerHTML = queue.map((q, index) => {
        const levelText = q.level === 'vip' ? 'VIP' : (q.level === 'premium' ? '高級' : '普通');
        const badgeClass = q.level === 'vip' ? 'badge-vip' : (q.level === 'premium' ? 'badge-premium' : 'badge-normal');
        
        return `
        <div class="queue-item">
            <div>
                <strong>#${index + 1} ${q.nickname}</strong>
                <span class="badge ${badgeClass}" style="margin-left: 10px;">${levelText}</span>
                <div style="font-size: 12px; color: #666; margin-top: 3px;">UID: ${q.gameUID}</div>
            </div>
            <button class="btn btn-danger btn-small" onclick="removeFromQueue('${q.username}')">移除</button>
        </div>
        `;
    }).join('');
}

function renderCodeLists(activationCodes) {
    const unused = activationCodes.filter(c => !c.used);
    const used = activationCodes.filter(c => c.used);
    
    document.getElementById('unusedCodeCount').textContent = unused.length;
    document.getElementById('usedCodeCount').textContent = used.length;

    // 根據當前分頁渲染
    if (currentCodeSubTab === 'unused') {
        const unusedContainer = document.getElementById('unusedCodeList');
        unusedContainer.innerHTML = unused.length === 0 ? '<div class="empty-state">沒有未使用的兌換碼</div>' :
            unused.map(c => {
                const levelText = c.level === 'vip' ? 'VIP' : (c.level === 'premium' ? '高級' : '普通');
                const badgeClass = c.level === 'vip' ? 'badge-vip' : (c.level === 'premium' ? 'badge-premium' : 'badge-normal');
                const timeObj = secondsToTime(c.seconds);
                return `
                <div class="code-item">
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <div>
                            <strong style="font-family: 'Courier New', monospace; font-size: 1.2em;">${c.code}</strong>
                            <span class="badge ${badgeClass}" style="margin-left: 10px;">${levelText}</span>
                        </div>
                        <button class="btn btn-danger btn-small" onclick="deleteCode('${c.code}')">刪除</button>
                    </div>
                    <div style="margin-top: 10px; color: #666;">
                        時長: ${formatTimeDisplay(timeObj)} | 建立日期: ${new Date(c.createdDate).toLocaleDateString('zh-TW')}
                    </div>
                </div>
                `;
            }).join('');
    }

    if (currentCodeSubTab === 'used') {
        const usedContainer = document.getElementById('usedCodeList');
        usedContainer.innerHTML = used.length === 0 ? '<div class="empty-state">沒有已使用的兌換碼</div>' :
            used.slice().reverse().map(c => { // 反轉陣列，讓最新的在最上面
                const levelText = c.level === 'vip' ? 'VIP' : (c.level === 'premium' ? '高級' : '普通');
                const badgeClass = c.level === 'vip' ? 'badge-vip' : (c.level === 'premium' ? 'badge-premium' : 'badge-normal');
                return `
                <div class="code-item used">
                    <strong style="font-family: 'Courier New', monospace; font-size: 1.2em;">${c.code}</strong>
                    <span class="badge ${badgeClass}" style="margin-left: 10px;">${levelText}</span>
                    <div style="margin-top: 10px; color: #333;">
                        使用者: <strong>${c.usedBy}</strong> | 使用日期: ${new Date(c.usedDate).toLocaleDateString('zh-TW')}
                    </div>
                </div>
                `;
            }).join('');
    }
}

function renderMemberLists(members) {
    // 移除管理員帳號，不在列表顯示
    const allMembers = members.filter(m => m.username !== 'admin');
    
    const active = allMembers.filter(m => m.remainingSeconds > 0);
    const expired = allMembers.filter(m => m.remainingSeconds <= 0);
    
    document.getElementById('activeMemberCount').textContent = active.length;
    document.getElementById('expiredMemberCount').textContent = expired.length;

    const renderMemberItem = (m) => {
        const levelText = m.level === 'vip' ? 'VIP' : (m.level === 'premium' ? '高級' : '普通');
        const badgeClass = m.level === 'vip' ? 'badge-vip' : (m.level === 'premium' ? 'badge-premium' : 'badge-normal');
        const timeObj = secondsToTime(m.remainingSeconds);
        const timeClass = getTimeColorClass(m.remainingSeconds);
        const platformText = m.platform === 'tiktok' ? 'TikTok' : 'YouTube';
        const itemClass = m.remainingSeconds > 0 ? 'active' : 'expired';

        return `
        <div class="member-item ${itemClass}">
            <div class="member-header">
                <div>
                    <strong>${m.nickname}</strong> (@${m.username})
                    <span class="badge ${badgeClass}" style="margin-left: 10px;">${levelText}</span>
                    ${m.isAdmin ? '<span class="badge-admin">管理員</span>' : ''}
                </div>
                <div class="admin-actions">
                    <button class="btn btn-small" onclick="openEditMember('${m.username}')">編輯</button>
                    <button class="btn btn-danger btn-small" onclick="deleteMember('${m.username}')">刪除</button>
                </div>
            </div>
            <div style="font-size: 14px; color: #333; line-height: 1.8;">
                <div>UID: ${m.gameUID} | 平台: ${platformText}</div>
                <div>剩餘時間: <span class="countdown-time ${timeClass}" data-username="${m.username}">${formatTimeDisplay(timeObj)}</span></div>
                <div>加入日期: ${new Date(m.joinDate).toLocaleDateString('zh-TW')}</div>
            </div>
        </div>
        `;
    };

    if (currentMemberSubTab === 'active') {
        const activeContainer = document.getElementById('activeMemberList');
        activeContainer.innerHTML = active.length === 0 ? '<div class="empty-state">沒有生效中的會員</div>' : active.map(renderMemberItem).join('');
    }
    
    if (currentMemberSubTab === 'expired') {
        const expiredContainer = document.getElementById('expiredMemberList');
        expiredContainer.innerHTML = expired.length === 0 ? '<div class="empty-state">沒有已到期的會員</div>' : expired.map(renderMemberItem).join('');
    }
}

function renderBackupInfo(lastBackupTime) {
    const container = document.getElementById('backupInfo');
    if (lastBackupTime) {
        container.innerHTML = `<strong>上次備份時間:</strong> ${new Date(lastBackupTime).toLocaleString('zh-TW')}`;
    } else {
        container.innerHTML = '<strong>尚未備份過</strong>';
    }
}

// ==================== 管理員功能 (實作) ====================

// --- 遊戲場次 / 排隊 ---
async function createGameSession() {
    const gameName = document.getElementById('sessionGameName').value.trim() || 'CODM 會員場';
    const slots = parseInt(document.getElementById('sessionSlots').value.trim()) || 10;
    const description = document.getElementById('sessionDescription').value.trim();

    const newSession = {
        gameName,
        slots,
        description,
        startTime: new Date().toISOString()
    };

    if (!confirm(`確定要開啟場次嗎？\n名稱: ${gameName}\n名額: ${slots}`)) return;

    showLoading();
    try {
        await database.ref('gameSession').set(newSession);
        alert('遊戲場次已開啟！會員現在可以排隊了');
        await refreshAdminDashboard();
    } catch (error) {
        console.error("開啟場次失敗:", error);
        alert('開啟場次失敗');
    } finally {
        hideLoading();
    }
}

async function closeGameSession() {
    if (!confirm('確定要關閉目前的遊戲場次嗎？\n(這不會清空排隊名單)')) return;

    showLoading();
    try {
        await database.ref('gameSession').set(null);
        alert('遊戲場次已關閉');
        await refreshAdminDashboard();
    } catch (error) {
        console.error("關閉場次失敗:", error);
        alert('關閉場次失敗');
    } finally {
        hideLoading();
    }
}

async function removeFromQueue(username) {
    if (!confirm(`確定要將 ${username} 移出排隊嗎？`)) return;

    showLoading();
    try {
        await database.ref(`queue/${username}`).remove();
        alert(`${username} 已被移出排隊`);
        await refreshAdminDashboard();
    } catch (error) {
        console.error("移除排隊失敗:", error);
        alert('移除失敗');
    } finally {
        hideLoading();
    }
}

async function clearQueue() {
    if (!confirm('！警告！\n確定要清空所有排隊名單嗎？此操作無法復原。')) return;

    showLoading();
    try {
        await database.ref('queue').set(null);
        alert('排隊名單已清空');
        await refreshAdminDashboard();
    } catch (error) {
        console.error("清空排隊失敗:", error);
        alert('清空失敗');
    } finally {
        hideLoading();
    }
}

// --- 兌換碼 ---
async function generateCode() {
    const level = document.getElementById('codeLevel').value;
    const days = parseInt(document.getElementById('codeDays').value) || 0;
    const amount = parseInt(document.getElementById('codeAmount').value) || 1;

    if (days <= 0) {
        alert('請輸入有效的天數');
        return;
    }

    if (amount > 100) {
        if (!confirm(`你確定要一次產生 ${amount} 組兌換碼嗎？`)) return;
    }
    
    const seconds = days * 24 * 60 * 60;
    const timeObj = secondsToTime(seconds);
    
    showLoading();
    const generatedList = document.getElementById('generatedCodesList');
    generatedList.innerHTML = `<h3>產生的新碼 (共 ${amount} 組):</h3>`;

    try {
        const data = await loadData();
        const newCodes = [];
        
        for (let i = 0; i < amount; i++) {
            let newCode;
            // 確保兌換碼不重複
            do {
                newCode = generateActivationCode();
            } while (data.activationCodes.find(c => c.code === newCode));

            const codeData = {
                code: newCode,
                level: level,
                seconds: seconds,
                createdDate: new Date().toISOString(),
                used: false,
                usedBy: null,
                usedDate: null
            };
            data.activationCodes.push(codeData);
            newCodes.push(codeData);
        }

        await saveData(data.members, data.activationCodes, data.queue, data.gameSession);
        
        // 顯示產生的碼
        newCodes.forEach(c => {
            const levelText = c.level === 'vip' ? 'VIP' : (c.level === 'premium' ? '高級' : '普通');
            generatedList.innerHTML += `
            <div class="code-item">
                <strong style="font-family: 'Courier New', monospace; font-size: 1.2em;">${c.code}</strong>
                (${levelText} - ${formatTimeDisplay(timeObj)})
                <button class="btn-copy" onclick="copyToClipboard('${c.code}', this)">📋 複製</button>
            </div>
            `;
        });
        
        alert(`成功產生 ${amount} 組兌換碼！`);
        await refreshAdminDashboard(); // 刷新列表
    } catch (error) {
        console.error("產生兌換碼失敗:", error);
        alert('產生失敗');
    } finally {
        hideLoading();
    }
}

async function deleteCode(code) {
    if (!confirm(`確定要刪除兌換碼 ${code} 嗎？此操作無法復原。`)) return;

    showLoading();
    try {
        await database.ref(`activationCodes/${code}`).remove();
        alert(`兌換碼 ${code} 已刪除`);
        await refreshAdminDashboard();
    } catch (error) {
        console.error("刪除兌換碼失敗:", error);
        alert('刪除失敗');
    } finally {
        hideLoading();
    }
}

// --- 會員管理 ---
async function openEditMember(username) {
    showLoading();
    try {
        const data = await loadData();
        const member = data.members.find(m => m.username === username);
        if (!member) {
            alert('找不到會員');
            hideLoading();
            return;
        }
        
        editingMember = member; // 設置全局變數
        
        const timeObj = secondsToTime(member.remainingSeconds);
        const timeClass = getTimeColorClass(member.remainingSeconds);
        
        const content = document.getElementById('editMemberContent');
        content.innerHTML = `
        <h3>正在編輯: ${member.nickname} (@${member.username})</h3>
        <p>剩餘時間: <span id="editMemberCountdown" class="countdown-time ${timeClass}">${formatTimeDisplay(timeObj)}</span></p>
        
        <hr style="margin: 20px 0;">
        
        <h4>手動調整時間</h4>
        <div class="input-row">
            <input type="number" id="editYears" placeholder="年">
            <input type="number" id="editMonths" placeholder="月">
            <input type="number" id="editDays" placeholder="天">
            <input type="number" id="editHours" placeholder="時">
        </div>
        <div style="margin: 10px 0; display: flex; gap: 10px;">
            <button class="btn btn-success btn-small" onclick="adjustTime(true)">增加時間</button>
            <button class="btn btn-danger btn-small" onclick="adjustTime(false)">減少時間</button>
        </div>
        
        <hr style="margin: 20px 0;">
        
        <h4>修改會員資料</h4>
        <div class="input-group">
            <label>暱稱</label>
            <input type="text" id="editNickname" value="${member.nickname}">
        </div>
        <div class="input-group">
            <label>CODM UID</label>
            <input type="text" id="editGameUID" value="${member.gameUID}">
        </div>
        <div class="input-group">
            <label>會員等級</label>
            <select id="editLevel">
                <option value="normal" ${member.level === 'normal' ? 'selected' : ''}>普通</option>
                <option value="premium" ${member.level === 'premium' ? 'selected' : ''}>高級</option>
                <option value="vip" ${member.level === 'vip' ? 'selected' : ''}>VIP</option>
            </select>
        </div>
        <div class="input-group">
            <label>平台</label>
            <select id="editPlatform">
                <option value="tiktok" ${member.platform === 'tiktok' ? 'selected' : ''}>TikTok</option>
                <option value="youtube" ${member.platform === 'youtube' ? 'selected' : ''}>YouTube</option>
            </select>
        </div>
        
        <hr style="margin: 20px 0;">
        
        <h4>管理員權限</h4>
        <div class="input-group">
            <label>
                <input type="checkbox" id="editIsAdmin" ${member.isAdmin ? 'checked' : ''}>
                設為管理員
            </label>
        </div>
        
        <button class="btn" onclick="saveMemberEdit()" style="width: 100%;">儲存變更</button>
        `;
        
        openEditMemberModal();
        
    } catch (error) {
        console.error("開啟編輯失敗:", error);
    } finally {
        hideLoading();
    }
}

async function adjustTime(isAdding) {
    const years = parseInt(document.getElementById('editYears').value) || 0;
    const months = parseInt(document.getElementById('editMonths').value) || 0;
    const days = parseInt(document.getElementById('editDays').value) || 0;
    const hours = parseInt(document.getElementById('editHours').value) || 0;
    
    const secondsToAdd = timeToSeconds(years, months, days, hours, 0, 0);
    
    if (secondsToAdd <= 0) {
        alert('請輸入有效的時間');
        return;
    }
    
    const actionText = isAdding ? '增加' : '減少';
    const timeText = formatTimeDisplay(secondsToTime(secondsToAdd));
    
    if (!confirm(`確定要為 ${editingMember.username} ${actionText} ${timeText} 嗎？`)) return;
    
    showLoading();
    try {
        const data = await loadData();
        const member = data.members.find(m => m.username === editingMember.username);
        
        if (isAdding) {
            member.remainingSeconds += secondsToAdd;
        } else {
            member.remainingSeconds = Math.max(0, member.remainingSeconds - secondsToAdd);
        }
        // 更新秒數時，也要更新 lastUpdateTime
        member.lastUpdateTime = Math.floor(Date.now() / 1000);
        
        await saveData(data.members, data.activationCodes, data.queue, data.gameSession);
        
        // 刷新彈窗內的顯示
        const timeObj = secondsToTime(member.remainingSeconds);
        const timeClass = getTimeColorClass(member.remainingSeconds);
        document.getElementById('editMemberCountdown').textContent = formatTimeDisplay(timeObj);
        document.getElementById('editMemberCountdown').className = 'countdown-time ' + timeClass;
        
        // 清空輸入框
        document.getElementById('editYears').value = '';
        document.getElementById('editMonths').value = '';
        document.getElementById('editDays').value = '';
        document.getElementById('editHours').value = '';

        alert(`已${actionText}時間！`);
        await refreshAdminDashboard(); // 刷新主列表
    } catch (error) {
        console.error("調整時間失敗:", error);
    } finally {
        hideLoading();
    }
}

async function saveMemberEdit() {
    if (!editingMember) return;
    
    const newNickname = document.getElementById('editNickname').value.trim();
    const newGameUID = document.getElementById('editGameUID').value.trim();
    const newLevel = document.getElementById('editLevel').value;
    const newPlatform = document.getElementById('editPlatform').value;
    const newIsAdmin = document.getElementById('editIsAdmin').checked;
    
    if (!newNickname || !newGameUID) {
        alert('暱稱和 UID 不可為空');
        return;
    }
    
    showLoading();
    try {
        const data = await loadData();
        const member = data.members.find(m => m.username === editingMember.username);
        
        member.nickname = newNickname;
        member.gameUID = newGameUID;
        member.level = newLevel;
        member.platform = newPlatform;
        member.isAdmin = newIsAdmin;
        
        await saveData(data.members, data.activationCodes, data.queue, data.gameSession);
        
        alert('會員資料已儲存');
        closeEditMemberModal();
        await refreshAdminDashboard();
        
    } catch (error) {
        console.error("儲存會員失敗:", error);
    } finally {
        hideLoading();
    }
}

async function deleteMember(username) {
    if (username === 'admin') {
        alert('不可刪除主要管理員帳號');
        return;
    }
    
    if (!confirm(`！警告！\n確定要永久刪除會員 ${username} 嗎？\n此操作無法復原。`)) return;
    
    showLoading();
    try {
        const data = await loadData();
        
        // 1. 從會員列表刪除
        const memberIndex = data.members.findIndex(m => m.username === username);
        if (memberIndex > -1) {
            data.members.splice(memberIndex, 1);
        }
        
        // 2. 從排隊列表刪除
        const queueIndex = data.queue.findIndex(q => q.username === username);
        if (queueIndex > -1) {
            data.queue.splice(queueIndex, 1);
        }
        
        // 3. (可選) 找到並重置該會員使用過的兌換碼？
        // 暫不實作，刪除會員即可
        
        await saveData(data.members, data.activationCodes, data.queue, data.gameSession);
        
        alert(`會員 ${username} 已被永久刪除`);
        await refreshAdminDashboard();
        
    } catch (error) {
        console.error("刪除會員失敗:", error);
    } finally {
        hideLoading();
    }
}

// --- 更改密碼 (管理員自己的) ---
async function changePassword() {
    const currentPassword = document.getElementById('currentPassword').value.trim();
    const newPassword = document.getElementById('changeNewPassword').value.trim();
    const confirmPassword = document.getElementById('changeConfirmPassword').value.trim();

    if (!currentPassword || !newPassword || !confirmPassword) {
        alert('請填寫完整資訊');
        return;
    }
    if (newPassword.length < 6) {
        alert('新密碼至少需要6個字元');
        return;
    }
    if (newPassword !== confirmPassword) {
        alert('兩次輸入的新密碼不一致');
        return;
    }

    showLoading();
    try {
        const currentPasswordHash = await hashPassword(currentPassword);
        if (currentPasswordHash !== currentUser.passwordHash) {
            alert('目前密碼錯誤');
            hideLoading();
            return;
        }

        const data = await loadData();
        const member = data.members.find(m => m.username === currentUser.username);
        member.passwordHash = await hashPassword(newPassword);
        await saveData(data.members, data.activationCodes, data.queue, data.gameSession);

        currentUser.passwordHash = member.passwordHash;

        alert('密碼更改成功！');
        closeChangePasswordModal();
    } catch (error) {
        console.error('更改密碼失敗:', error);
        alert('更改密碼失敗，請稍後再試');
    } finally {
        hideLoading();
    }
}

// ==================== 子分頁切換 ====================
function showCodeSubTab(tabName) {
    currentCodeSubTab = tabName;
    document.querySelectorAll('#generate, #unused, #used').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.sub-tabs button').forEach(t => t.classList.remove('active'));
    
    document.getElementById(tabName).classList.add('active');
    document.querySelector(`.sub-tabs button[onclick="showCodeSubTab('${tabName}')"]`).classList.add('active');
    
    // 切換分頁時立即刷新該列表的內容
    refreshAdminDashboard();
}

function showMemberSubTab(tabName) {
    currentMemberSubTab = tabName;
    document.querySelectorAll('#activeMembers, #expiredMembers').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.sub-tabs button').forEach(t => t.classList.remove('active'));
    
    document.getElementById(tabName).classList.add('active');
    document.querySelector(`.sub-tabs button[onclick="showMemberSubTab('${tabName}')"]`).classList.add('active');
    
    // 切換分頁時立即刷新該列表的內容
    refreshAdminDashboard();
}

// ==================== 備份功能 ====================
function initDailyBackup() {
    // 每日 23:59 執行備份
    function getTimeUntilMidnight() {
        const now = new Date();
        const midnight = new Date();
        midnight.setHours(23, 59, 59, 999);
        return midnight - now;
    }

    function performBackup() {
        console.log('執行每日自動備份...');
        exportToExcel(true); // 傳入 true 表示是自動備份
    }

    const timeUntilMidnight = getTimeUntilMidnight();
    setTimeout(() => {
        performBackup();
        dailyBackupInterval = setInterval(performBackup, 24 * 60 * 60 * 1000);
    }, timeUntilMidnight);
    
    console.log(`每日自動備份將在 ${formatTimeDisplay(secondsToTime(Math.floor(timeUntilMidnight/1000)))} 後執行`);
}

async function exportToExcel(isAuto = false) {
    if (!isAuto) {
        showLoading();
    }
    try {
        const data = await loadData();

        if (data.members.length === 0) {
            if (!isAuto) alert('目前沒有會員資料可導出');
            return;
        }

        const memberData = data.members.map(member => {
            const timeObj = secondsToTime(member.remainingSeconds);
            const levelText = member.level === 'vip' ? 'VIP會員' : (member.level === 'premium' ? '高級會員' : '普通會員');
            const platformText = member.platform === 'tiktok' ? 'TikTok' : 'YouTube';
            const statusText = member.remainingSeconds > 0 ? '生效中' : '已到期';

            return {
                '使用者名稱': member.username, '暱稱': member.nickname, '平台': platformText,
                'CODM UID': member.gameUID, '會員等級': levelText, '狀態': statusText,
                '剩餘時間': formatTimeDisplay(timeObj), '剩餘秒數': member.remainingSeconds,
                '兌換碼': member.activationCode, '加入日期': new Date(member.joinDate).toLocaleDateString('zh-TW'),
                '是否為管理員': member.isAdmin ? '是' : '否'
            };
        });

        const wb = XLSX.utils.book_new();
        const ws1 = XLSX.utils.json_to_sheet(memberData);
        XLSX.utils.book_append_sheet(wb, ws1, "會員資料");

        const codeData = data.activationCodes.map(code => {
            const levelText = code.level === 'vip' ? 'VIP會員' : (code.level === 'premium' ? '高級會員' : '普通會員');
            const timeObj = secondsToTime(code.seconds);

            return {
                '兌換碼': code.code, '會員等級': levelText, '時長': formatTimeDisplay(timeObj),
                '秒數': code.seconds, '狀態': code.used ? '已使用' : '未使用',
                '使用者': code.usedBy || '', '創建日期': new Date(code.createdDate).toLocaleDateString('zh-TW'),
                '使用日期': code.usedDate ? new Date(code.usedDate).toLocaleDateString('zh-TW') : ''
            };
        });

        const ws2 = XLSX.utils.json_to_sheet(codeData);
        XLSX.utils.book_append_sheet(wb, ws2, "兌換碼");

        const now = new Date();
        const fileName = `CODM會員資料_${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}_${String(now.getHours()).padStart(2,'0')}${String(now.getMinutes()).padStart(2,'0')}.xlsx`;

        XLSX.writeFile(wb, fileName);

        await database.ref('lastBackupTime').set(new Date().toISOString());
        
        if (!isAuto) {
            alert('Excel 備份已完成！\n檔案名稱：' + fileName);
        }
        
        renderBackupInfo(new Date().toISOString()); // 立即更新畫面

    } catch (error) {
        console.error('備份失敗:', error);
        if (!isAuto) alert('備份失敗，請稍後再試');
    } finally {
        if (!isAuto) hideLoading();
    }
}
