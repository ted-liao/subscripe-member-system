<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-lang-key="page_title">管理後台 - 廖嘉泰の會員管理系統</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Microsoft JhengHei', 'PingFang TC', Arial, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    padding: 20px;
}

.container {
    max-width: 1400px; /* <-- 已拓寬 */
    margin: 0 auto;
}

.top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 30px;
    flex-wrap: wrap;
    gap: 15px;
}

.header {
    color: white;
}

.header h1 {
    font-size: 2.5em;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
    margin-bottom: 5px;
}

.header p {
    font-size: 1.1em;
}

.user-section {
    display: flex;
    gap: 10px;
    align-items: center;
}

.lang-switcher {
    display: flex;
    align-items: center;
    margin-right: 15px;
}
.btn-lang {
    background: none;
    border: none;
    color: white;
    cursor: pointer;
    font-size: 15px;
    font-weight: bold;
    opacity: 0.7;
    transition: opacity 0.3s;
    padding: 5px;
}
.btn-lang:hover {
    opacity: 1;
}
.btn-lang.active {
    opacity: 1;
    text-decoration: underline;
    text-underline-offset: 3px;
}
a.btn {
    text-decoration: none;
    color: white;
}

.user-info {
    background: white;
    padding: 12px 20px;
    border-radius: 25px;
    display: flex;
    align-items: center;
    gap: 10px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
}

.user-info .avatar {
    width: 35px;
    height: 35px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-weight: bold;
}

.user-info .name {
    font-weight: bold;
    color: #333;
}

.badge-admin {
    background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
    color: white;
    padding: 3px 10px;
    border-radius: 12px;
    font-size: 12px;
    font-weight: bold;
}

.card {
    background: white;
    border-radius: 15px;
    padding: 30px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    margin-bottom: 20px;
}

.tabs {
    display: flex;
    gap: 10px;
    margin-bottom: 30px;
    flex-wrap: wrap;
}

.tab {
    padding: 12px 24px;
    background: #f0f0f0;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
    transition: all 0.3s;
}

.tab.active {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
}

.tab:hover {
    transform: translateY(-2px);
}

.page {
    display: none;
}

.page.active {
    display: block;
}

.sub-tabs {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
    border-bottom: 2px solid #e0e0e0;
    padding-bottom: 10px;
}

.sub-tab {
    padding: 10px 20px;
    background: transparent;
    border: none;
    border-bottom: 3px solid transparent;
    cursor: pointer;
    font-size: 15px;
    color: #666;
    transition: all 0.3s;
}

.sub-tab.active {
    color: #667eea;
    border-bottom-color: #667eea;
    font-weight: bold;
}

.sub-tab:hover {
    color: #667eea;
}

.sub-page {
    display: none;
}

.sub-page.active {
    display: block;
}

.input-group {
    margin-bottom: 20px;
}

.input-group label {
    display: block;
    margin-bottom: 8px;
    color: #333;
    font-weight: bold;
}

.input-group label .optional {
    font-weight: normal;
    color: #999;
    font-size: 0.9em;
}

.input-group input, .input-group select, .input-group textarea {
    width: 100%;
    padding: 12px;
    border: 2px solid #e0e0e0;
    border-radius: 8px;
    font-size: 16px;
    transition: border 0.3s;
    font-family: inherit;
}

.input-group input:focus, .input-group select:focus, .input-group textarea:focus {
    outline: none;
    border-color: #667eea;
}

.input-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
    gap: 10px;
}

.input-row input {
    text-align: center;
}

.btn {
    padding: 12px 30px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
    transition: all 0.3s;
}

.btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
}

.btn-danger {
    background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
}

.btn-success {
    background: linear-gradient(135deg, #84fab0 0%, #8fd3f4 100%);
}

.btn-small {
    padding: 8px 16px;
    font-size: 14px;
}

.btn-link {
    background: none;
    color: #667eea;
    text-decoration: underline;
    padding: 5px;
    font-size: 14px;
}

.btn-link:hover {
    transform: none;
    box-shadow: none;
    color: #764ba2;
}

.btn-copy {
    background: #667eea;
    color: white;
    border: none;
    padding: 5px 12px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 14px;
    margin-left: 10px;
    transition: all 0.3s;
}

.btn-copy:hover {
    background: #764ba2;
    transform: scale(1.05);
}

.member-info {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    padding: 25px;
    border-radius: 12px;
    margin-bottom: 20px;
}

.member-info h2 {
    margin-bottom: 15px;
}

.info-item {
    display: flex;
    justify-content: space-between;
    padding: 10px 0;
    border-bottom: 1px solid rgba(255,255,255,0.2);
    align-items: center;
}

.info-item:last-child {
    border-bottom: none;
}

.badge {
    display: inline-block;
    padding: 5px 15px;
    border-radius: 20px;
    font-size: 14px;
    font-weight: bold;
}

.badge-gold {
    background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
    color: #333;
}

.badge-diamond {
    background: linear-gradient(135deg, #B9F2FF 0%, #00B4DB 100%);
    color: #fff;
}

.badge-legend {
    background: linear-gradient(135deg, #FF6B6B 0%, #C44569 100%);
    color: #fff;
}

.queue-card {
    background: #f9f9f9;
    padding: 30px;
    border-radius: 10px;
    text-align: center;
    margin-bottom: 20px;
}

.queue-position {
    font-size: 3em;
    font-weight: bold;
    color: #667eea;
    margin: 20px 0;
}

.queue-status {
    background: white;
    padding: 20px;
    border-radius: 10px;
    margin-top: 20px;
}

.queue-item {
    background: #f9f9f9;
    padding: 15px;
    border-radius: 8px;
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.queue-item.current {
    background: #d4edda;
    border: 2px solid #28a745;
}

.member-item {
    background: #f9f9f9;
    padding: 20px;
    border-radius: 10px;
    margin-bottom: 15px;
    border-left: 4px solid #667eea;
}

.member-item.expired {
    background: #f1f1f1;
    border-left-color: #999;
}

.member-item.active {
    background: #e8f5e9;
    border-left-color: #28a745;
}

.code-item {
    background: #fff3cd;
    padding: 20px;
    border-radius: 10px;
    margin-bottom: 15px;
    border-left: 4px solid #ffc107;
}

.code-item.used {
    background: #d4edda;
    border-left-color: #28a745;
}

.member-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    flex-wrap: wrap;
    gap: 10px;
}

.admin-actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

.empty-state {
    text-align: center;
    padding: 40px;
    color: #999;
}

.time-display {
    font-size: 1.5em;
    font-weight: bold;
    color: #27ae60;
    margin: 10px 0;
}

.time-display.warning {
    color: #f39c12;
}

.time-display.danger {
    color: #e74c3c;
}

.countdown-time {
    font-weight: bold;
    color: #27ae60;
}

.countdown-time.warning {
    color: #f39c12;
}

.countdown-time.danger {
    color: #e74c3c;
}

.text-link {
    text-align: center;
    margin-top: 15px;
}

.modal {
    display: none;
    position: fixed;
    z-index: 1000;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0,0,0,0.5);
}

.modal.active {
    display: flex;
    justify-content: center;
    align-items: center;
}

.modal-content {
    background-color: white;
    padding: 30px;
    border-radius: 15px;
    max-width: 500px;
    width: 90%;
    max-height: 90vh;
    overflow-y: auto;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
}

.modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

.modal-close {
    background: none;
    border: none;
    font-size: 24px;
    cursor: pointer;
    color: #999;
}

.modal-close:hover {
    color: #333;
}

.game-session-card {
    background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
    color: white;
    padding: 25px;
    border-radius: 12px;
    margin-bottom: 20px;
    text-align: center;
}

.game-session-card h2 {
    margin-bottom: 15px;
}

.game-session-info {
    font-size: 1.2em;
    margin: 10px 0;
}

.auto-refresh-indicator {
    display: inline-block;
    width: 10px;
    height: 10px;
    background: #28a745;
    border-radius: 50%;
    margin-left: 10px;
    animation: pulse 2s infinite;
}

.warning-box {
    background: #fff3cd;
    border: 2px solid #ffc107;
    color: #856404;
    padding: 15px;
    border-radius: 8px;
    margin-bottom: 20px;
}

.warning-box strong {
    display: block;
    margin-bottom: 5px;
}

.code-display {
    background: #f8f9fa;
    border: 2px dashed #667eea;
    padding: 20px;
    border-radius: 10px;
    text-align: center;
    margin: 20px 0;
}

.code-display .code {
    font-size: 2em;
    font-weight: bold;
    color: #667eea;
    letter-spacing: 3px;
    font-family: 'Courier New', monospace;
}

.copy-area {
    display: inline-flex;
    align-items: center;
    gap: 10px;
}

.admin-panel {
    display: none;
    margin-top: 30px;
    padding: 20px;
    background: #f0f8ff;
    border: 2px solid #667eea;
    border-radius: 10px;
}

.admin-panel.active {
    display: block;
}

.admin-panel h3 {
    color: #667eea;
    margin-bottom: 20px;
}

.backup-info {
    background: #e8f5e9;
    padding: 15px;
    border-radius: 8px;
    margin-bottom: 20px;
    border-left: 4px solid #4caf50;
}

.backup-info strong {
    color: #2e7d32;
}

.settings-section {
    background: #f9f9f9;
    padding: 20px;
    border-radius: 10px;
    margin-bottom: 20px;
}

.settings-section h4 {
    margin-bottom: 15px;
    color: #667eea;
}

.loading-overlay {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.7);
    z-index: 9999;
    justify-content: center;
    align-items: center;
}

.loading-overlay.active {
    display: flex;
}

.loading-spinner {
    width: 50px;
    height: 50px;
    border: 5px solid #f3f3f3;
    border-top: 5px solid #667eea;
    border-radius: 50%;
    animation: spin 1s linear infinite;
}

.admin-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
    gap: 20px;
}

.card h2 {
    color: #667eea;
    margin-bottom: 20px;
    border-bottom: 2px solid #f0f0f0;
    padding-bottom: 10px;
}

.list-container {
    max-height: 400px;
    overflow-y: auto;
    padding-right: 10px;
    border: 1px solid #f0f0f0;
    border-radius: 8px;
    padding: 10px;
}

.priority-badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 12px;
    font-size: 12px;
    font-weight: bold;
    margin-left: 8px;
}

.priority-badge.legend {
    background: linear-gradient(135deg, #FF6B6B 0%, #C44569 100%);
    color: white;
}

.priority-badge.diamond {
    background: linear-gradient(135deg, #B9F2FF 0%, #00B4DB 100%);
    color: white;
}

@keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}

@keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
}

@media (max-width: 768px) {
    .header h1 {
        font-size: 1.8em;
    }

    .card {
        padding: 20px;
    }

    .tabs {
        flex-direction: column;
    }

    .tab {
        width: 100%;
    }

    .top-bar {
        flex-direction: column;
        align-items: flex-start;
    }

    .user-section {
        width: 100%;
        flex-wrap: wrap; 
    }

    .user-info {
        width: 100%;
        justify-content: center;
    }

    .sub-tabs {
        flex-wrap: wrap;
    }
}
</style>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>

<div id="loadingOverlay" class="loading-overlay">
    <div class="loading-spinner"></div>
</div>

<div class="container">
    <div class="top-bar">
        <div class="header">
            <h1 data-lang-key="admin_title">⚙️ 管理後台</h1>
            <p data-lang-key="app_subtitle">📢 廖嘉泰の會員管理系統</p>
        </div>

        <div class="user-section" id="userSection">
            <div class="lang-switcher">
                <button class="btn-lang" onclick="setLanguage('en')">English</button>
                <span style="color: white; margin: 0 5px;">|</span>
                <button class="btn-lang active" onclick="setLanguage('zh')">中文</button>
            </div>
            </div>
    </div>

    <div id="adminDashboard" style="display: none;">

        <div class="admin-grid">
            <div class="card">
                <h2 data-lang-key="session_control_title">🎮 遊戲場次控制</h2>
                <div id="currentGameSession">
                    </div>
                <div class="input-group">
                    <label data-lang-key="session_name_label">場次名稱 (例如: 會員場)</label>
                    <input type="text" id="sessionGameName" data-lang-key="session_name_placeholder" placeholder="CODM 會員場">
                </div>
                <div class="input-group">
                    <label><span data-lang-key="session_start_label">預計開始時間</span> <span class="optional" data-lang-key="session_start_note">(留空則為立即)</span></label>
                    <input type="datetime-local" id="sessionStartTime">
                </div>
                <div class="input-group">
                    <label data-lang-key="session_slots_label">名額</label>
                    <input type="number" id="sessionSlots" value="10">
                </div>
                <div class="input-group">
                    <label><span data-lang-key="session_desc_label">描述</span> <span class="optional" data-lang-key="optional">(選填)</span></label>
                    <input type="text" id="sessionDescription" data-lang-key="session_desc_placeholder" placeholder="地圖:...">
                </div>
                <button class="btn" onclick="createGameSession()" data-lang-key="session_create_button">🚀 開啟/預約場次</button>
                <button class="btn btn-danger" onclick="closeGameSession()" data-lang-key="session_close_button">❌ 關閉場次</button>
            </div>

            <div class="card">
                <h2 data-lang-key="queue_list_title">👥 目前排隊名單</h2>
                <div style="margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center;">
                    <span id="queueCount"></span>
                    <button class="btn btn-danger btn-small" onclick="clearQueue()" data-lang-key="queue_clear_button">清空名單</button>
                </div>
                <div class="list-container" id="adminQueueList">
                    </div>
            </div>
        </div>

        <div class="card">
            <h2 data-lang-key="code_admin_title">🔑 兌換碼管理</h2>
            <div class="sub-tabs">
                <button class="sub-tab active" onclick="showCodeSubTab('generate')"><span data-lang-key="code_tab_generate">產生新碼</span></button>
                <button class="sub-tab" onclick="showCodeSubTab('unused')"><span data-lang-key="code_tab_unused">未使用</span> (<span id="unusedCodeCount">0</span>)</button>
                <button class="sub-tab" onclick="showCodeSubTab('used')"><span data-lang-key="code_tab_used">已使用</span> (<span id="usedCodeCount">0</span>)</button>
                </div>

            <div id="generate" class="sub-page active">
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px;">
                    <div class="input-group">
                        <label data-lang-key="code_level_label">會員等級</label>
                        <select id="codeLevel">
                            <option value="gold" data-lang-key="level_gold">💛 黃金會員</option>
                            <option value="diamond" data-lang-key="level_diamond">💎 鑽石會員</option>
                            <option value="legend" data-lang-key="level_legend">🔥 傳說會員</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label data-lang-key="code_days_label">天數</label>
                        <input type="number" id="codeDays" value="30">
                    </div>
                    <div class="input-group">
                        <label data-lang-key="code_amount_label">數量</label>
                        <input type="number" id="codeAmount" value="1">
                    </div>
                </div>
                <button class="btn" onclick="generateCode()" data-lang-key="code_generate_button">產生兌換碼</button>
                <div id="generatedCodesList" style="margin-top: 20px;"></div>
            </div>

            <div id="unused" class="sub-page">
                <div class="list-container" id="unusedCodeList"></div>
            </div>

            <div id="used" class="sub-page">
                <div class="list-container" id="usedCodeList"></div>
            </div>
        </div>

        <div class="card">
            <h2 data-lang-key="member_admin_title">🧑‍🤝‍🧑 會員管理</h2>
            <div class="sub-tabs">
                <button class="sub-tab active" onclick="showMemberSubTab('active')"><span data-lang-key="member_tab_active">生效中</span> (<span id="activeMemberCount">0</span>)</button>
                <button class="sub-tab" onclick="showMemberSubTab('expired')"><span data-lang-key="member_tab_expired">已到期</span> (<span id="expiredMemberCount">0</span>)</button>
                </div>

            <div id="activeMembers" class="sub-page active">
                <div class="list-container" id="activeMemberList"></div>
            </div>
            <div id="expiredMembers" class="sub-page">
                <div class="list-container" id="expiredMemberList"></div>
            </div>
        </div>
        
        <div class="card">
            <h2 data-lang-key="backup_title">📈 系統備份</h2>
            <div class="backup-info" id="backupInfo">
            </div>
            <button class="btn btn-success" onclick="exportToExcel()" data-lang-key="backup_button">🗂️ 立即導出 Excel 備份</button>
        </div>

    </div>
</div>

<div id="loginModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2 id="loginModalTitle" data-lang-key="login_title_admin">管理員登入</h2>
            <button class="modal-close" onclick="closeLoginModal()">×</button>
        </div>
        <div class="input-group">
            <label data-lang-key="username">使用者名稱</label>
            <input type="text" id="loginUsername" data-lang-key="username_placeholder" placeholder="請輸入使用者名稱">
        </div>
        <div class="input-group">
            <label data-lang-key="password">密碼</label>
            <input type="password" id="loginPassword" data-lang-key="password_placeholder" placeholder="請輸入密碼">
        </div>
        <button class="btn" onclick="login()" style="width: 100%; margin-bottom: 10px;" data-lang-key="login">登入</button>
    </div>
</div>

<div id="registerModal" class="modal">
</div>

<div id="forgotPasswordModal" class="modal">
</div>

<div id="changePasswordModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2 data-lang-key="change_password_title">更改密碼</h2>
            <button class="modal-close" onclick="closeChangePasswordModal()">×</button>
        </div>
        <div class="input-group">
            <label data-lang-key="current_password">目前密碼</label>
            <input type="password" id="currentPassword" data-lang-key="current_password_placeholder" placeholder="請輸入目前密碼">
        </div>
        <div class="input-group">

// 負責切換語言的函數
function setLanguage(lang) {
    // 1. 保存用戶偏好
    localStorage.setItem('language', lang);

    // 2. 更新按鈕的 .active 狀態
    document.querySelectorAll('.btn-lang').forEach(btn => {
        if (btn.getAttribute('onclick') === `setLanguage('${lang}')`) {
            btn.classList.add('active');
        } else {
            btn.classList.remove('active');
        }
    });

    // 3. 翻譯所有帶 data-lang-key 的元素
    const langDict = translations[lang];
    document.querySelectorAll('[data-lang-key]').forEach(el => {
        const key = el.dataset.langKey;
        const translation = langDict[key];

        if (translation === undefined) {
            console.warn(`Missing translation for key: ${key} in lang: ${lang}`);
            return;
        }

        // 根據不同標籤類型賦值
        if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') {
            if (el.type === 'datetime-local') {
                // 不翻譯 datetime-local 的 placeholder
            } else {
                el.placeholder = translation;
            }
        } else if (el.tagName === 'OPTION') {
             el.textContent = translation;
        } else {
            // 保留按鈕/連結前的圖示
            const icon = el.innerHTML.match(/^(<.*?>|.*?<\/.*?>|💎|📝|⚙️|🔒|🚀|🏠|🔥|💛|🎮|❌|👥|🔑|🧑‍🤝‍🧑|📈|🗂️)/);
            if ((el.tagName === 'BUTTON' || el.tagName === 'A' || el.tagName === 'H2') && icon && icon[0].length < 20) {
                
                // ▼▼▼ 這是針對 <button><span>...</span> (<span>...</span>)</button> 的特殊處理 ▼▼▼
                const innerSpan = el.querySelector('span[data-lang-key]');
                if (innerSpan) {
                     innerSpan.textContent = translation;
                } 
                // ▲▲▲ 特殊處理結束 ▲▲▲
                
                else {
                    el.innerHTML = `${icon[0]} ${translation}`;
                }
            } else {
                el.textContent = translation;
            }
        }
    });

    // 4. 動態翻譯登入後的按鈕 (如果存在)
    updateUserSection(); // 重新整理 user section 就會自動翻譯
    
    // 5. 如果儀表板已載入，重新整理動態內容
    if (document.getElementById('adminDashboard').style.display === 'block') {
        refreshAdminDashboard();
    }
}

async function hashPassword(password) {
    const encoder = new TextEncoder();
    const data = encoder.encode(password);
    const hashBuffer = await crypto.subtle.digest('SHA-256', data);
    const hashArray = Array.from(new Uint8Array(hashBuffer));
    return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
}

// 【已修改】 包含排隊優先級排序
async function loadData() {
    try {
        const membersSnapshot = await database.ref('members').once('value');
        const codesSnapshot = await database.ref('activationCodes').once('value');
        const queueSnapshot = await database.ref('queue').once('value');
        const sessionSnapshot = await database.ref('gameSession').once('value');
        const backupSnapshot = await database.ref('lastBackupTime').once('value');

        const membersData = membersSnapshot.val() || {};
        const members = Object.keys(membersData).map(key => ({
            ...membersData[key],
            username: key
        }));

        const codesData = codesSnapshot.val() || {};
        const activationCodes = Object.values(codesData);

        const queueData = queueSnapshot.val() || {};
        const queue = Object.values(queueData); // 1. 從物件轉為陣列

        // 【修改】 採用新的排序邏輯
        queue.sort((a, b) => {
            const adminA = a.adminOrder || 9999; // 9999 代表沒有手動排過
            const adminB = b.adminOrder || 9999;

            // 1. 如果有手動排序，以此為準
            if (adminA !== 9999 || adminB !== 9999) {
                return adminA - adminB;
            }
            
            // 2. 如果都沒有手動排序，才用優先級
            const priorityA = a.priorityLevel || 0;
            const priorityB = b.priorityLevel || 0;
            if (priorityA !== priorityB) {
                return priorityB - priorityA; // 優先級高的在前
            }
            
            // 3. 優先級也相同，用加入時間
            return new Date(a.joinTime) - new Date(b.joinTime);
        });

        return {
            members,
            activationCodes,
            queue, // 3. 回傳排好序的陣列
            gameSession: sessionSnapshot.val(),
            lastBackupTime: backupSnapshot.val()
        };
    } catch (error) {
        console.error('載入資料失敗:', error);
        return { members: [], activationCodes: [], queue: [], gameSession: null, lastBackupTime: null };
    }
}

}

function secondsToTime(seconds) {
    if (seconds <= 0) return { years: 0, months: 0, days: 0, hours: 0, minutes: 0, seconds: 0 };
    const years = Math.floor(seconds / (365 * 24 * 60 * 60));
    seconds %= (365 * 24 * 60 * 60);
    const months = Math.floor(seconds / (30 * 24 * 60 * 60));
    seconds %= (30 * 24 * 60 * 60);
    const days = Math.floor(seconds / (24 * 60 * 60));
    seconds %= (24 * 60 * 60);
    const hours = Math.floor(seconds / (60 * 60));
    seconds %= (60 * 60);
    const minutes = Math.floor(seconds / 60);
    seconds %= 60;
    return { years, months, days, hours, minutes, seconds };
}

function timeToSeconds(years, months, days, hours, minutes, seconds) {
    return (years * 365 * 24 * 60 * 60) +
        (months * 30 * 24 * 60 * 60) +
        (days * 24 * 60 * 60) +
        (hours * 60 * 60) +
        (minutes * 60) +
        seconds;
}

function formatTimeDisplay(timeObj) {
    const lang = getCurrentLang();
    const trans = translations[lang];
    const parts = [];
    if (timeObj.years > 0) parts.push(`${timeObj.years}${trans.time_year}`);
    if (timeObj.months > 0) parts.push(`${timeObj.months}${trans.time_month}`);
    if (timeObj.days > 0) parts.push(`${timeObj.days}${trans.time_day}`);
    if (timeObj.hours > 0) parts.push(`${timeObj.hours}${trans.time_hour}`);
    if (timeObj.minutes > 0) parts.push(`${timeObj.minutes}${trans.time_minute}`);
    if (timeObj.seconds > 0) parts.push(`${timeObj.seconds}${trans.time_second}`);
    return parts.join(' ') || `0${trans.time_second}`;
}

function getTimeColorClass(seconds) {
    if (seconds <= 0) return 'danger';
    if (seconds <= 259200) return 'danger';
    if (seconds <= 604800) return 'warning';

}

function generateActivationCode() {

}

function startGlobalCountdown() {
    if (countdownInterval) clearInterval(countdownInterval);

    countdownInterval = setInterval(async () => {
        await updateAllCountdowns();

async function updateAllCountdowns() {
    try {
        const data = await loadData();
        const now = Math.floor(Date.now() / 1000);
        let membersToUpdate = {}; // 批次更新
        let needRefreshAdmin = false;

        data.members.forEach(member => {
            const elapsed = now - (member.lastUpdateTime || now); // 防呆
            if (elapsed > 0 && member.remainingSeconds > 0) {
                const oldRemaining = member.remainingSeconds;
                const oldExpired = oldRemaining <= 0;
                
                member.remainingSeconds = Math.max(0, member.remainingSeconds - elapsed);
                member.lastUpdateTime = now;

                if (oldRemaining !== member.remainingSeconds) {
                    membersToUpdate[member.username] = {
                        remainingSeconds: member.remainingSeconds,
                        lastUpdateTime: member.lastUpdateTime
                    };
                }

                const newExpired = member.remainingSeconds <= 0;
                if (!oldExpired && newExpired) {
                    needRefreshAdmin = true; // 有會員剛過期
                }
            }
        });

        if (Object.keys(membersToUpdate).length > 0) {
            for (const username in membersToUpdate) {
                // 使用 .update() 避免覆蓋其他欄位
                await database.ref('members/' + username).update(membersToUpdate[username]);
            }
        }
        
        // 如果有會員剛過期，且剛好在看會員列表，就刷新
        if (needRefreshAdmin && (currentMemberSubTab === 'active' || currentMemberSubTab === 'expired')) {
            await refreshAdminDashboard();
        }

        // 更新編輯彈窗中的倒數
        const modalCountdown = document.getElementById('editMemberCountdown');
        if (modalCountdown && editingMember) {
            const member = data.members.find(m => m.username === editingMember.username);
            if (member) {
                const timeObj = secondsToTime(member.remainingSeconds);
                modalCountdown.textContent = formatTimeDisplay(timeObj);
                modalCountdown.className = 'countdown-time ' + getTimeColorClass(member.remainingSeconds);
            }
        }

    } catch (error) {
        console.error('更新倒數失敗:', error);
    }
}

        clearInterval(countdownInterval);

// 【已修改】 移除舊的 moveQueueItem，改用新的 promptMoveItem
async function promptMoveItem(username, currentPosition) {
    const lang = getCurrentLang();
    const trans = translations[lang];
    
    // 1. 彈出視窗詢問新位置
    const newPositionStr = prompt(trans.alert_move_prompt_title.replace('{username}', username), currentPosition);
    
    if (newPositionStr === null || newPositionStr === "") {
        return; // 用戶取消
    }
    
    const newPosition = parseInt(newPositionStr);
    
    if (isNaN(newPosition) || newPosition <= 0) {
        alert(trans.alert_move_invalid_number);
        return;
    }
    
    showLoading();
    try {
        const data = await loadData(); // 2. 取得當前已排序的列表
        let queue = data.queue;
        
        if (newPosition > queue.length) {
            alert(trans.alert_move_too_large.replace('{max}', queue.length));
            hideLoading();
            return;
        }
        
        // 3. 在本地陣列中移動
        const itemToMove = queue.find(q => q.username === username);
        const oldIndex = queue.findIndex(q => q.username === username);
        
        if (oldIndex > -1) {
            queue.splice(oldIndex, 1); // 移除
        }
        queue.splice(newPosition - 1, 0, itemToMove); // 插入到新位置 (index 是 newPosition - 1)
        
        // 4. 建立一個更新物件，為 *所有* 項目分配新的 adminOrder
        const updates = {};
        queue.forEach((item, index) => {
            // `index + 1` 確保 order 從 1 開始
            // 這樣排序後，adminOrder 會是 1, 2, 3...
            updates[`/queue/${item.username}/adminOrder`] = index + 1;
        });
        
        // 5. 一次性將所有更新寫入 Firebase
        await database.ref().update(updates);
        
        await refreshAdminDashboard(); // 立即刷新畫面
        
    } catch (error) {
        console.error("調整順序失敗:", error);
        alert(trans.alert_op_fail);
    } finally {
        hideLoading();
    }
}


async function generateCode() {
    const level = document.getElementById('codeLevel').value;
    const days = parseInt(document.getElementById('codeDays').value) || 0;
    const amount = parseInt(document.getElementById('codeAmount').value) || 1;
    const lang = getCurrentLang();
    const trans = translations[lang];

    if (days <= 0) {
        alert(trans.alert_code_invalid_days);
        return;
    }

    if (amount > 100) {
        if (!confirm(trans.alert_code_gen_confirm.replace('{amount}', amount))) return;
    }
    
    const seconds = days * 24 * 60 * 60;
    const timeObj = secondsToTime(seconds);
    
    showLoading();
    const generatedList = document.getElementById('generatedCodesList');
    generatedList.innerHTML = `<h3>${trans.alert_code_gen_list_title.replace('{amount}', amount)}</h3>`;

    try {
        const data = await loadData();
        const newCodes = [];
        
        for (let i = 0; i < amount; i++) {
            let newCode;
            do {
                newCode = generateActivationCode();
            } while (data.activationCodes.find(c => c.code === newCode));

            const codeData = {
                code: newCode,
                level: level,
                seconds: seconds,
                createdDate: new Date().toISOString(),
                used: false,
                usedBy: null,
                usedDate: null
            };
            data.activationCodes.push(codeData);
            newCodes.push(codeData);
        }

        await saveData(data.members, data.activationCodes, data.queue, data.gameSession);
        
        newCodes.forEach(c => {
            const levelText = c.level === 'legend' ? trans.level_legend_simple : (c.level === 'diamond' ? trans.level_diamond_simple : trans.level_gold_simple);
            generatedList.innerHTML += `
            <div class="code-item">
                <strong style="font-family: 'Courier New', monospace; font-size: 1.2em;">${c.code}</strong>
                (${levelText} - ${formatTimeDisplay(timeObj)})
                <button class="btn-copy" onclick="copyToClipboard('${c.code}', this)">📋 ${trans.copy}</button>
            </div>
            `;
        });
        
        alert(trans.alert_code_gen_success.replace('{amount}', amount));
        await refreshAdminDashboard();
    } catch (error) {
        console.error("產生兌換碼失敗:", error);
        alert(trans.alert_code_gen_fail);
    } finally {
        hideLoading();
    }
}

async function adjustTime(isAdding) {
    const years = parseInt(document.getElementById('editYears').value) || 0;
    const months = parseInt(document.getElementById('editMonths').value) || 0;
    const days = parseInt(document.getElementById('editDays').value) || 0;
    const hours = parseInt(document.getElementById('editHours').value) || 0;
    const lang = getCurrentLang();
    const trans = translations[lang];
    
    const secondsToAdd = timeToSeconds(years, months, days, hours, 0, 0);
    
    if (secondsToAdd <= 0) {
        alert(trans.alert_time_invalid);
        return;
    }
    
    const actionText = isAdding ? trans.alert_time_add : trans.alert_time_reduce;
    const timeText = formatTimeDisplay(secondsToTime(secondsToAdd));
    
    if (!confirm(trans.alert_time_adjust_confirm.replace('{username}', editingMember.username).replace('{action}', actionText).replace('{timeText}', timeText))) return;
    
    showLoading();
    try {
        const memberRef = database.ref('members/' + editingMember.username);
        const snapshot = await memberRef.once('value');
        const member = snapshot.val();
        
        let newRemainingSeconds;
        if (isAdding) {
            newRemainingSeconds = (member.remainingSeconds || 0) + secondsToAdd;
        } else {
            newRemainingSeconds = Math.max(0, (member.remainingSeconds || 0) - secondsToAdd);
        }
        
        await memberRef.update({
            remainingSeconds: newRemainingSeconds,
            lastUpdateTime: Math.floor(Date.now() / 1000)
        });
        
        const timeObj = secondsToTime(newRemainingSeconds);
        const timeClass = getTimeColorClass(newRemainingSeconds);
        document.getElementById('editMemberCountdown').textContent = formatTimeDisplay(timeObj);
        document.getElementById('editMemberCountdown').className = 'countdown-time ' + timeClass;
        
        document.getElementById('editYears').value = '';
        document.getElementById('editMonths').value = '';
        document.getElementById('editDays').value = '';
        document.getElementById('editHours').value = '';

        alert(trans.alert_time_adjust_success.replace('{action}', actionText));
        await refreshAdminDashboard();
    } catch (error) {
        console.error("調整時間失敗:", error);
    } finally {
        hideLoading();
    }
}

async function changePassword() {
    const currentPassword = document.getElementById('currentPassword').value.trim();
    const newPassword = document.getElementById('changeNewPassword').value.trim();
    const confirmPassword = document.getElementById('changeConfirmPassword').value.trim();
    const lang = getCurrentLang();
    const trans = translations[lang];

    if (!currentPassword || !newPassword || !confirmPassword) {
        alert(trans.alert_fill_all);
        return;
    }
    if (newPassword.length < 6) {
        alert(trans.alert_password_short);
        return;
    }
    if (newPassword !== confirmPassword) {
        alert(trans.alert_password_mismatch);
        return;
    }

    showLoading();
    try {
        const currentPasswordHash = await hashPassword(currentPassword);
        if (currentPasswordHash !== currentUser.passwordHash) {
            alert(trans.alert_current_password_wrong);
            hideLoading();
            return;
        }

        const newPasswordHash = await hashPassword(newPassword);
        // 只更新密碼
        await database.ref('members/' + currentUser.username).update({
            passwordHash: newPasswordHash
        });

        currentUser.passwordHash = newPasswordHash;

        alert(trans.alert_password_change_success);
        closeChangePasswordModal();
    } catch (error) {
        console.error('更改密碼失敗:', error);
        alert(trans.alert_password_change_fail);
    } finally {
        hideLoading();
    }
}

function initDailyBackup() {
    function getTimeUntilMidnight() {
        const now = new Date();
        const midnight = new Date();
        midnight.setHours(23, 59, 59, 999);
        return midnight - now;
    }

    function performBackup() {
        console.log('執行每日自動備份...');
        exportToExcel(true);
    }

    const timeUntilMidnight = getTimeUntilMidnight();
    setTimeout(() => {
        performBackup();
        dailyBackupInterval = setInterval(performBackup, 24 * 60 * 60 * 1000);
    }, timeUntilMidnight);
    
    console.log(`每日自動備份將在 ${formatTimeDisplay(secondsToTime(Math.floor(timeUntilMidnight/1000)))} 後執行`);
}

async function exportToExcel(isAuto = false) {
    const lang = getCurrentLang();
    const trans = translations[lang];

    if (!isAuto) {
        showLoading();
    }
    try {
        const data = await loadData();

        if (data.members.length === 0) {
            if (!isAuto) alert(trans.alert_no_backup_data);
            return;
        }

        const memberData = data.members.map(member => {
            const timeObj = secondsToTime(member.remainingSeconds);
            const levelText = member.level === 'legend' ? '傳說會員' : (member.level === 'diamond' ? '鑽石會員' : '黃金會員');
            const platformText = member.platform === 'tiktok' ? 'TikTok' : 'YouTube';
            const statusText = member.remainingSeconds > 0 ? '生效中' : '已到期';

            return {
                '使用者名稱': member.username, '暱稱': member.nickname, '平台': platformText,
                'CODM UID': member.gameUID, '會員等級': levelText, '狀態': statusText,
                '剩餘時間': formatTimeDisplay(timeObj), '剩餘秒數': member.remainingSeconds,
                '兌換碼': member.activationCode, '加入日期': new Date(member.joinDate).toLocaleDateString('zh-TW'),
                '是否為管理員': member.isAdmin ? '是' : '否',
                '插隊次數': member.priorityQuota // 導出插隊次數
            };
        });

        const wb = XLSX.utils.book_new();
        const ws1 = XLSX.utils.json_to_sheet(memberData);
        XLSX.utils.book_append_sheet(wb, ws1, "會員資料");

        const codeData = data.activationCodes.map(code => {
            const levelText = code.level === 'legend' ? '傳說會員' : (code.level === 'diamond' ? '鑽石會員' : '黃金會員');
            const timeObj = secondsToTime(code.seconds);

            return {
                '兌換碼': code.code, '會員等級': levelText, '時長': formatTimeDisplay(timeObj),
                '秒數': code.seconds, '狀態': code.used ? '已使用' : '未使用',
                '使用者': code.usedBy || '', '創建日期': new Date(code.createdDate).toLocaleDateString('zh-TW'),
                '使用日期': code.usedDate ? new Date(code.usedDate).toLocaleDateString('zh-TW') : ''
            };
        });

        const ws2 = XLSX.utils.json_to_sheet(codeData);
        XLSX.utils.book_append_sheet(wb, ws2, "兌換碼");

        const now = new Date();
        const fileName = `CODM會員資料_${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}_${String(now.getHours()).padStart(2,'0')}${String(now.getMinutes()).padStart(2,'0')}.xlsx`;

        XLSX.writeFile(wb, fileName);

        await database.ref('lastBackupTime').set(new Date().toISOString());
        
        if (!isAuto) {
            alert('Excel 備份已完成！\n檔案名稱：' + fileName);
        }
        
        renderBackupInfo(new Date().toISOString());

    } catch (error) {
        console.error('備份失敗:', error);
        if (!isAuto) alert(trans.alert_backup_fail);
    } finally {
        if (!isAuto) hideLoading();
    }
}
