<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CODM會員管理系統</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft JhengHei', 'PingFang TC', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }
        
        .header {
            color: white;
        }
        
        .header h1 {
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            margin-bottom: 5px;
        }
        
        .header p {
            font-size: 1.1em;
        }
        
        .user-section {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        
        .user-info {
            background: white;
            padding: 12px 20px;
            border-radius: 25px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        
        .user-info .avatar {
            width: 35px;
            height: 35px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }
        
        .user-info .name {
            font-weight: bold;
            color: #333;
        }
        
        .badge-admin {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
        }
        
        .card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }
        
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        
        .tab {
            padding: 12px 24px;
            background: #f0f0f0;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s;
        }
        
        .tab.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .tab:hover {
            transform: translateY(-2px);
        }
        
        .page {
            display: none;
        }
        
        .page.active {
            display: block;
        }
        
        .sub-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid #e0e0e0;
            padding-bottom: 10px;
        }
        
        .sub-tab {
            padding: 10px 20px;
            background: transparent;
            border: none;
            border-bottom: 3px solid transparent;
            cursor: pointer;
            font-size: 15px;
            color: #666;
            transition: all 0.3s;
        }
        
        .sub-tab.active {
            color: #667eea;
            border-bottom-color: #667eea;
            font-weight: bold;
        }
        
        .sub-tab:hover {
            color: #667eea;
        }
        
        .sub-page {
            display: none;
        }
        
        .sub-page.active {
            display: block;
        }
        
        .input-group {
            margin-bottom: 20px;
        }
        
        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: bold;
        }
        
        .input-group label .optional {
            font-weight: normal;
            color: #999;
            font-size: 0.9em;
        }
        
        .input-group input, .input-group select, .input-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border 0.3s;
            font-family: inherit;
        }
        
        .input-group input:focus, .input-group select:focus, .input-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .input-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
            gap: 10px;
        }
        
        .input-row input {
            text-align: center;
        }
        
        .btn {
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn-danger {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }
        
        .btn-success {
            background: linear-gradient(135deg, #84fab0 0%, #8fd3f4 100%);
        }
        
        .btn-small {
            padding: 8px 16px;
            font-size: 14px;
        }
        
        .btn-link {
            background: none;
            color: #667eea;
            text-decoration: underline;
            padding: 5px;
            font-size: 14px;
        }
        
        .btn-link:hover {
            transform: none;
            box-shadow: none;
            color: #764ba2;
        }
        
        .btn-copy {
            background: #667eea;
            color: white;
            border: none;
            padding: 5px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            margin-left: 10px;
            transition: all 0.3s;
        }
        
        .btn-copy:hover {
            background: #764ba2;
            transform: scale(1.05);
        }
        
        .member-info {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 20px;
        }
        
        .member-info h2 {
            margin-bottom: 15px;
        }
        
        .info-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255,255,255,0.2);
            align-items: center;
        }
        
        .info-item:last-child {
            border-bottom: none;
        }
        
        .badge {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
        }
        
        .badge-vip {
            background: gold;
            color: #333;
        }
        
        .badge-premium {
            background: silver;
            color: #333;
        }
        
        .badge-normal {
            background: #95a5a6;
            color: white;
        }
        
        .queue-card {
            background: #f9f9f9;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 20px;
        }
        
        .queue-position {
            font-size: 3em;
            font-weight: bold;
            color: #667eea;
            margin: 20px 0;
        }
        
        .queue-status {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
        }
        
        .queue-item {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .queue-item.current {
            background: #d4edda;
            border: 2px solid #28a745;
        }
        
        .member-item {
            background: #d4edda;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
            border-left: 4px solid #28a745;
        }
        
        .member-item.expired {
            background: #e0e0e0;
            border-left-color: #999;
        }
        
        .code-item {
            background: #fff3cd;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
            border-left: 4px solid #ffc107;
        }
        
        .code-item.used {
            background: #d4edda;
            border-left-color: #28a745;
        }
        
        .code-item.expired {
            background: #e0e0e0;
            border-left-color: #999;
        }
        
        .member-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .admin-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }
        
        .time-display {
            font-size: 1.5em;
            font-weight: bold;
            color: #27ae60;
            margin: 10px 0;
        }
        
        .time-display.warning {
            color: #f39c12;
        }
        
        .time-display.danger {
            color: #e74c3c;
        }
        
        .countdown-time {
            font-weight: bold;
            color: #27ae60;
        }
        
        .countdown-time.warning {
            color: #f39c12;
        }
        
        .countdown-time.danger {
            color: #e74c3c;
        }
        
        .text-link {
            text-align: center;
            margin-top: 15px;
        }
        
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
        }
        
        .modal.active {
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .modal-content {
            background-color: white;
            padding: 30px;
            border-radius: 15px;
            max-width: 500px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .modal-close {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #999;
        }
        
        .modal-close:hover {
            color: #333;
        }
        
        .game-session-card {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .game-session-card h2 {
            margin-bottom: 15px;
        }
        
        .game-session-info {
            font-size: 1.2em;
            margin: 10px 0;
        }
        
        .auto-refresh-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            background: #28a745;
            border-radius: 50%;
            margin-left: 10px;
            animation: pulse 2s infinite;
        }
        
        .warning-box {
            background: #fff3cd;
            border: 2px solid #ffc107;
            color: #856404;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        
        .warning-box strong {
            display: block;
            margin-bottom: 5px;
        }
        
        .code-display {
            background: #f8f9fa;
            border: 2px dashed #667eea;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            margin: 20px 0;
        }
        
        .code-display .code {
            font-size: 2em;
            font-weight: bold;
            color: #667eea;
            letter-spacing: 3px;
            font-family: 'Courier New', monospace;
        }
        
        .copy-area {
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }
        
        .admin-panel {
            display: none;
            margin-top: 30px;
            padding: 20px;
            background: #f0f8ff;
            border: 2px solid #667eea;
            border-radius: 10px;
        }
        
        .admin-panel.active {
            display: block;
        }
        
        .admin-panel h3 {
            color: #667eea;
            margin-bottom: 20px;
        }
        
        .backup-info {
            background: #e8f5e9;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #4caf50;
        }
        
        .backup-info strong {
            color: #2e7d32;
        }

        .settings-section {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .settings-section h4 {
            margin-bottom: 15px;
            color: #667eea;
        }

        .status-badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 15px;
            font-weight: bold;
            font-size: 0.9em;
        }
        
        .status-unused { background: #f2c94c; color: #333; }
        .status-using { background: #38ef7d; color: white; }
        .status-expired { background: #95a5a6; color: white; }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8em;
            }
            
            .card {
                padding: 20px;
            }
            
            .tabs {
                flex-direction: column;
            }
            
            .tab {
                width: 100%;
            }
            
            .top-bar {
                flex-direction: column;
                align-items: flex-start;
            }
            
            .user-section {
                width: 100%;
                flex-direction: column;
            }
            
            .user-info {
                width: 100%;
                justify-content: center;
            }
            
            .sub-tabs {
                flex-wrap: wrap;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-bar">
            <div class="header">
                <h1>🎮 CODM會員管理系統</h1>
                <p>Call of Duty Mobile 遊戲主播專屬平台</p>
            </div>
            
            <div class="user-section" id="userSection">
                <button class="btn btn-small" onclick="openLoginModal()">登入</button>
                <button class="btn btn-success btn-small" onclick="openRegisterModal()">註冊</button>
            </div>
        </div>
        
        <div class="card">
            <div class="tabs">
                <button class="tab active" onclick="showPage('home')">首頁</button>
                <button class="tab" onclick="showPage('queue')">排隊系統</button>
                <button class="tab" onclick="showPage('member')">我的會員</button>
            </div>
            
            <!-- 首頁 -->
            <div id="home" class="page active">
                <h2 style="margin-bottom: 20px;">歡迎來到 CODM 會員系統</h2>

                <div style="padding: 20px; background: #f9f9f9; border-radius: 10px;">
                    <h3 style="margin-bottom: 15px;">會員方案</h3>
                    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-top: 20px;">
                        <div style="background: white; padding: 20px; border-radius: 10px; text-align: center;">
                            <div class="badge badge-normal" style="margin-bottom: 10px;">普通會員</div>
                            <div style="font-size: 2em; font-weight: bold; color: #667eea; margin: 10px 0;">NT$100</div>
                            <div style="color: #666;">30天有效期</div>
                        </div>
                        <div style="background: white; padding: 20px; border-radius: 10px; text-align: center;">
                            <div class="badge badge-premium" style="margin-bottom: 10px;">高級會員</div>
                            <div style="font-size: 2em; font-weight: bold; color: #667eea; margin: 10px 0;">NT$180</div>
                            <div style="color: #666;">60天有效期</div>
                        </div>
                        <div style="background: white; padding: 20px; border-radius: 10px; text-align: center;">
                            <div class="badge badge-vip" style="margin-bottom: 10px;">VIP會員</div>
                            <div style="font-size: 2em; font-weight: bold; color: #667eea; margin: 10px 0;">NT$250</div>
                            <div style="color: #666;">90天有效期</div>
                        </div>
                    </div>
                    <div style="margin-top: 30px; padding: 20px; background: white; border-radius: 10px;">
                        <h3 style="margin-bottom: 15px;">📝 如何註冊</h3>
                        <ol style="line-height: 2;">
                            <li>向主播購買會員方案，獲得 <strong>6位兌換碼</strong></li>
                            <li>點擊右上角「註冊」按鈕</li>
                            <li>輸入兌換碼和您的資料</li>
                            <li>完成註冊，開始享受會員權益！</li>
                        </ol>
                    </div>
                </div>
            </div>
            
            <!-- 排隊系統頁面 -->
            <div id="queue" class="page">
                <div id="queueContent"></div>
            </div>
            
            <!-- 會員資訊頁面 -->
            <div id="member" class="page">
                <div id="memberContent"></div>
                
                <!-- 管理員面板 -->
                <div id="adminPanel" class="admin-panel"></div>
            </div>
        </div>
    </div>
    
    <!-- 登入彈窗 -->
    <div id="loginModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>會員登入</h2>
                <button class="modal-close" onclick="closeLoginModal()">×</button>
            </div>
            <div class="input-group">
                <label>使用者名稱</label>
                <input type="text" id="loginUsername" placeholder="請輸入使用者名稱">
            </div>
            <div class="input-group">
                <label>密碼</label>
                <input type="password" id="loginPassword" placeholder="請輸入密碼">
            </div>
            <button class="btn" onclick="login()" style="width: 100%; margin-bottom: 10px;">登入</button>
            <div class="text-link">
                <button class="btn-link" onclick="openForgotPasswordModal()">忘記密碼？</button>
            </div>
        </div>
    </div>
    
    <!-- 註冊彈窗 -->
    <div id="registerModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>註冊會員</h2>
                <button class="modal-close" onclick="closeRegisterModal()">×</button>
            </div>
            <div class="input-group">
                <label>兌換碼</label>
                <input type="text" id="regActivationCode" placeholder="請輸入6位兌換碼" maxlength="6" style="text-transform: uppercase; letter-spacing: 2px;">
                <small style="color: #666; font-size: 12px;">向主播購買會員後獲得的兌換碼</small>
            </div>
            <div class="input-group">
                <label>使用者名稱</label>
                <input type="text" id="regUsername" placeholder="請輸入使用者名稱（用於登入）">
            </div>
            <div class="input-group">
                <label>密碼</label>
                <input type="password" id="regPassword" placeholder="請輸入密碼（至少6個字元）">
            </div>
            <div class="input-group">
                <label>確認密碼</label>
                <input type="password" id="regConfirmPassword" placeholder="請再次輸入密碼">
            </div>
            <div class="input-group">
                <label>平台選擇</label>
                <select id="regPlatform">
                    <option value="tiktok">TikTok</option>
                    <option value="youtube">YouTube</option>
                </select>
            </div>
            <div class="input-group">
                <label>TikTok/YouTube暱稱 <span class="optional">(選填)</span></label>
                <input type="text" id="regNickname" placeholder="請輸入你的TikTok或YouTube暱稱">
                <small style="color: #666; font-size: 12px;">如果不填寫，將使用使用者名稱作為暱稱</small>
            </div>
            <div class="input-group">
                <label>CODM UID</label>
                <input type="text" id="regGameUID" placeholder="請輸入 Call of Duty Mobile UID">
                <small style="color: #666; font-size: 12px;">可在遊戲內個人資料查看</small>
            </div>
            <div class="input-group">
                <label>安全問題（用於找回密碼）</label>
                <select id="regSecurityQuestion">
                    <option value="">請選擇安全問題</option>
                    <option value="pet">你的第一隻寵物叫什麼名字？</option>
                    <option value="school">你的小學校名是什麼？</option>
                    <option value="city">你出生的城市是哪裡？</option>
                    <option value="food">你最喜歡的食物是什麼？</option>
                    <option value="game">你最喜歡的CODM角色是什麼？</option>
                </select>
            </div>
            <div class="input-group">
                <label>安全答案</label>
                <input type="text" id="regSecurityAnswer" placeholder="請輸入答案（請記住此答案）">
            </div>
            <button class="btn" onclick="register()" style="width: 100%;">註冊</button>
        </div>
    </div>
    
    <!-- 忘記密碼彈窗 -->
    <div id="forgotPasswordModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>找回密碼</h2>
                <button class="modal-close" onclick="closeForgotPasswordModal()">×</button>
            </div>
            <div class="input-group">
                <label>使用者名稱</label>
                <input type="text" id="forgotUsername" placeholder="請輸入使用者名稱">
            </div>
            <button class="btn" onclick="checkSecurityQuestion()" style="width: 100%; margin-bottom: 20px;">下一步</button>
            
            <div id="securityQuestionSection" style="display: none;">
                <div class="input-group">
                    <label>安全問題</label>
                    <input type="text" id="displaySecurityQuestion" disabled style="background: #f0f0f0;">
                </div>
                <div class="input-group">
                    <label>安全答案</label>
                    <input type="text" id="securityAnswer" placeholder="請輸入答案">
                </div>
                <button class="btn" onclick="verifySecurityAnswer()" style="width: 100%;">驗證答案</button>
            </div>
            
            <div id="resetPasswordSection" style="display: none;">
                <div class="input-group">
                    <label>新密碼</label>
                    <input type="password" id="newPassword" placeholder="請輸入新密碼（至少6個字元）">
                </div>
                <div class="input-group">
                    <label>確認新密碼</label>
                    <input type="password" id="confirmNewPassword" placeholder="請再次輸入新密碼">
                </div>

        // 秒數轉換為年月日時分秒
        function secondsToTime(seconds) {
            if (seconds <= 0) return { years: 0, months: 0, days: 0, hours: 0, minutes: 0, seconds: 0 };
            
            const years = Math.floor(seconds / (365 * 24 * 60 * 60));
            seconds %= (365 * 24 * 60 * 60);
            
            const months = Math.floor(seconds / (30 * 24 * 60 * 60));
            seconds %= (30 * 24 * 60 * 60);
            
            const days = Math.floor(seconds / (24 * 60 * 60));
            seconds %= (24 * 60 * 60);
            
            const hours = Math.floor(seconds / (60 * 60));
            seconds %= (60 * 60);
            
            const minutes = Math.floor(seconds / 60);
            seconds %= 60;
            
            return { years, months, days, hours, minutes, seconds };
        }
        
        // 時間轉換為秒數
        function timeToSeconds(years, months, days, hours, minutes, seconds) {
            return (years * 365 * 24 * 60 * 60) + 
                   (months * 30 * 24 * 60 * 60) + 
                   (days * 24 * 60 * 60) + 
                   (hours * 60 * 60) + 
                   (minutes * 60) + 
                   seconds;
        }
        
        // 格式化時間顯示
        function formatTimeDisplay(timeObj) {
            const parts = [];
            if (timeObj.years > 0) parts.push(`${timeObj.years}年`);
            if (timeObj.months > 0) parts.push(`${timeObj.months}月`);
            if (timeObj.days > 0) parts.push(`${timeObj.days}天`);
            if (timeObj.hours > 0) parts.push(`${timeObj.hours}時`);
            if (timeObj.minutes > 0) parts.push(`${timeObj.minutes}分`);
            if (timeObj.seconds > 0) parts.push(`${timeObj.seconds}秒`);
            return parts.join(' ') || '0秒';
        }

            return '';
        }

            const activationCode = document.getElementById('regActivationCode').value.trim().toUpperCase();
            const username = document.getElementById('regUsername').value.trim();
            const password = document.getElementById('regPassword').value.trim();
            const confirmPassword = document.getElementById('regConfirmPassword').value.trim();
            const platform = document.getElementById('regPlatform').value;
            let nickname = document.getElementById('regNickname').value.trim();
            const gameUID = document.getElementById('regGameUID').value.trim();
            const securityQuestion = document.getElementById('regSecurityQuestion').value;
            const securityAnswer = document.getElementById('regSecurityAnswer').value.trim();
            
            if (!nickname) nickname = username;
            
            if (!activationCode || !username || !password || !confirmPassword || !gameUID || !securityQuestion || !securityAnswer) {
                alert('請填寫完整必填資訊（暱稱為選填）');
                return;

            if (password.length < 6) {

                    alert('使用者名稱已存在，請選擇其他名稱');

                if (!code) {
                    alert('兌換碼不存在或已被使用');
                    return;

                    securityQuestion: securityQuestion,
                    securityAnswer: securityAnswer.toLowerCase(),

                };

        // 切換頁面
        window.showPage = function(pageName) {
            currentPage = pageName;
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById(pageName).classList.add('active');
            event.target.classList.add('active');
            
            if (pageName === 'member') {
                showMemberInfo();
                if (isAdmin()) {
                    showAdminPanel();
                }
                startAutoRefresh();
            } else if (pageName === 'queue') {
                showQueuePage();
                startAutoRefresh();

            const data = await loadData();
            
            if (data.queue.find(q => q.username === currentUser.username)) {
                alert('你已經在排隊中了！');
                return;
            }
            
            const queueItem = {
                username: currentUser.username,
                nickname: currentUser.nickname,
                gameUID: currentUser.gameUID,
                level: currentUser.level,
                joinTime: new Date().toISOString()
            };
            
            data.queue.push(queueItem);
            await saveQueue(data.queue);
            
            alert('成功加入排隊！');
            showQueuePage();
        }

        // 離開排隊
        window.leaveQueue = async function() {
            if (!confirm('確定要離開排隊嗎？')) {
                return;
            }
            
            const data = await loadData();
            const newQueue = data.queue.filter(q => q.username !== currentUser.username);
            await saveQueue(newQueue);
            
            alert('已離開排隊');
            showQueuePage();
        }

        window.adjustTime = function(days, hours, minutes, seconds, months, years) {
            const daysInput = document.getElementById('editDays');
            const hoursInput = document.getElementById('editHours');
            const minutesInput = document.getElementById('editMinutes');
            const secondsInput = document.getElementById('editSeconds');
            const monthsInput = document.getElementById('editMonths');

            let currentYears = parseInt(yearsInput.value) || 0;
            let currentMonths = parseInt(monthsInput.value) || 0;
            let currentDays = parseInt(daysInput.value) || 0;
            let currentHours = parseInt(hoursInput.value) || 0;
            let currentMinutes = parseInt(minutesInput.value) || 0;
            let currentSeconds = parseInt(secondsInput.value) || 0;
            
            const totalSeconds = timeToSeconds(currentYears, currentMonths, currentDays, currentHours, currentMinutes, currentSeconds);
            const adjustSeconds = timeToSeconds(years, months, days, hours, minutes, seconds);
            const newTotalSeconds = Math.max(0, totalSeconds + adjustSeconds);
            
            const newTimeObj = secondsToTime(newTotalSeconds);
            
            yearsInput.value = newTimeObj.years;
            monthsInput.value = newTimeObj.months;
            daysInput.value = newTimeObj.days;
            hoursInput.value = newTimeObj.hours;
            minutesInput.value = newTimeObj.minutes;
            secondsInput.value = newTimeObj.seconds;

        // 更新所有倒數計時
        async function updateAllCountdowns() {
            const data = await loadData();
            const now = Math.floor(Date.now() / 1000);
            let needSave = false;
            const membersToUpdate = [];
            
            data.members.forEach(member => {
                const elapsed = now - member.lastUpdateTime;
                if (elapsed > 0) {
                    member.remainingSeconds = Math.max(0, member.remainingSeconds - elapsed);
                    member.lastUpdateTime = now;
                    membersToUpdate.push(member);
                    needSave = true;
                }
            });
            
            if (needSave && membersToUpdate.length > 0) {
                await saveAllMembers(membersToUpdate);
            }
            
            // 更新頁面上的倒數計時顯示
            document.querySelectorAll('.countdown-time').forEach(element => {
                const username = element.getAttribute('data-username');
                if (username) {
                    const member = data.members.find(m => m.username === username);
                    if (member) {
                        const timeObj = secondsToTime(member.remainingSeconds);
                        element.textContent = formatTimeDisplay(timeObj);
                        element.className = 'countdown-time ' + getTimeColorClass(member.remainingSeconds);
                    }
                }
            });
            
            // 更新當前使用者的時間顯示
            if (currentPage === 'member' && currentUser) {
                const member = data.members.find(m => m.username === currentUser.username);
                if (member) {
                    currentUser = member;
                    const timeDisplay = document.querySelector('.time-display');
                    if (timeDisplay) {
                        const timeObj = secondsToTime(member.remainingSeconds);
                        timeDisplay.textContent = formatTimeDisplay(timeObj);
                        timeDisplay.className = 'time-display ' + getTimeColorClass(member.remainingSeconds);
                    }
                }
            }
        }

        // 初始化每日備份
        function initDailyBackup() {
            function getTimeUntilMidnight() {
                const now = new Date();
                const midnight = new Date();
                midnight.setHours(23, 59, 59, 999);
                return midnight - now;
            }
            
            function performBackup() {
                window.exportToExcel();
                console.log('每日自動備份已執行:', new Date().toLocaleString('zh-TW'));
            }
            
            const timeUntilMidnight = getTimeUntilMidnight();
            setTimeout(() => {
                performBackup();
                dailyBackupInterval = setInterval(performBackup, 24 * 60 * 60 * 1000);
            }, timeUntilMidnight);
        }

        // ===== 系統初始化 =====
        
        async function initialize() {
            try {
                await initializeDefaultAdmin();
                updateUserSection();
                startGlobalCountdown();
                initDailyBackup();
                
                console.log('🎮 CODM 會員管理系統已啟動');
                console.log('📊 使用 Firebase Authentication + Realtime Database');
                
            } catch (error) {
                console.error('系統初始化錯誤:', error);
            }
        }

        // 啟動系統
        initialize();
    </script>
</body>
</html>
